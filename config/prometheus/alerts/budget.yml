# Prometheus alert rules — LLM budget thresholds
# Metric source: openbrain_budget_spent_usd gauge at core-api:3000/metrics
# Refreshed on every /metrics scrape (15s) via ai_audit_log SUM query.
#
# Notification path: application-level — budget-check skill (daily 07:00) sends
# Pushover when spend crosses soft ($30) / hard ($50) limits. These Prometheus rules
# provide Grafana annotation visibility and act as a safety net if the skill misses a run.
#
# Thresholds aligned with application code (budget-check.ts DEFAULT_SOFT_LIMIT/DEFAULT_HARD_LIMIT):
# $24 = 80% of $30 soft limit (warning); $50 = hard cap (critical).
# Related code: packages/core-api/src/routes/metrics.ts (budgetSpentUsd gauge)
#               packages/workers/src/skills/budget-check.ts (application alerting)
#
# ALERT DELIVERY MODEL (corrected 2026-07-15 — the previous note here was STALE).
# Alertmanager IS configured and connected: the standalone observability stack
# (ADR-0004) runs `observability-alertmanager`, and Prometheus reports it under
# /api/v1/alertmanagers. It routes to Pushover — critical -> pushover-critical
# (priority 1, repeat 1h), warning -> pushover-warning (priority 0, repeat 4h),
# unlabelled -> pushover-warning. So these rules DO page.
#
# The old note ("No Alertmanager is configured ... manual observation only") was
# true of open-brain's own bundled Prometheus and became false when observability
# was split out; it was never updated. It is the reason a reader concluded these
# rules were decorative (#289).
#
# BUT — RULES IN THIS DIRECTORY ARE NOT DEPLOYED FROM HERE. The running Prometheus
# reads /mnt/user/appdata/observability/config/prometheus/alerts (that project's
# own, non-git-managed dir). This repo's copies are advisory and CAN drift. Adding
# or editing a rule here does NOT change production until it is copied there and
# Prometheus is reloaded. See #292.
#
# Application-layer Pushover from workers skills (PushoverService) still exists and
# is independent of this path — some alerts intentionally have both.

groups:
  - name: open-brain-budget
    interval: 5m
    rules:
      - alert: BudgetAt80Percent
        expr: openbrain_budget_spent_usd >= 24
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM budget at 80% — {{ $value | printf \"%.2f\" }} USD of $30 soft limit"
          description: >
            Monthly LLM spend has reached the 80% warning threshold.
            Check ai_audit_log for high-cost models and verify ai-routing.yaml routes
            routine tasks to t1_spark (free) or t1_jetson (free) rather than OpenAI.
          runbook: "docs/runbooks/budget-alert.md"

      - alert: BudgetHardCap
        expr: openbrain_budget_spent_usd >= 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM budget at hard cap — {{ $value | printf \"%.2f\" }} USD"
          description: >
            Monthly spend has reached the $50 hard cap. The application-level budget
            circuit breaker in budget-check skill may have already fired. All further
            LLM calls that hit the hard-cap check will fail until next month reset.
          runbook: "docs/runbooks/budget-alert.md"
