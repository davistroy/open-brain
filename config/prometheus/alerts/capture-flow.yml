# Prometheus alert rules — capture flow staleness
# Metric source: openbrain_captures_total counter at core-api:3000/metrics
# This is a pull metric (not Pushgateway) — Prometheus scrapes core-api every 15s.
#
# Notification path: pipeline-health skill (every 6h) already implements the full
# time-of-day gate (07:00-midnight) and 24h suppression via skills_log.
# This Prometheus rule provides Grafana annotation visibility — the `increase()` over 6h
# evaluates to 0 whenever no new captures arrive, regardless of time-of-day.
# The application skill handles the business-hours gate; the Prometheus rule is additive.
#
# Related code: packages/workers/src/skills/pipeline-health.ts (capture flow check)
#               packages/core-api/src/routes/metrics.ts (capturesTotal counter)
#
# ALERT DELIVERY MODEL (corrected 2026-07-15 — the previous note here was STALE).
# Alertmanager IS configured and connected: the standalone observability stack
# (ADR-0004) runs `observability-alertmanager`, and Prometheus reports it under
# /api/v1/alertmanagers. It routes to Pushover — critical -> pushover-critical
# (priority 1, repeat 1h), warning -> pushover-warning (priority 0, repeat 4h).
# So these rules DO page.
#
# The old note ("...no alertmanager... manual observation only") was true of
# open-brain's own bundled Prometheus and became false when observability was split
# out; it was never updated. It is why a reader concluded these rules were
# decorative (#289).
#
# BUT — RULES IN THIS DIRECTORY ARE NOT DEPLOYED FROM HERE. The running Prometheus
# reads /mnt/user/appdata/observability/config/prometheus/alerts (that project's
# own, non-git-managed dir). This repo's copies are advisory and CAN drift. Editing
# a rule here does NOT change production until it is copied there and Prometheus is
# reloaded. See #292.
#
# Application-layer Pushover from workers skills / clients still exists and is
# independent of this path — some alerts intentionally have both.

groups:
  - name: open-brain-capture-flow
    interval: 5m
    rules:
      # Recording rule: captures in the past 6-hour sliding window.
      # Used by both the alert below and Grafana panels for trend visualization.
      - record: openbrain_captures_per_6h
        expr: increase(openbrain_captures_total[6h])

      - alert: CaptureFlowStale
        # Fires when no captures have been ingested in the past 6 hours.
        # Note: `increase()` on a counter returns 0 if counter has not changed.
        # The application-level pipeline-health skill handles time-of-day gating
        # and 24h suppression; this rule provides complementary Grafana annotation.
        expr: increase(openbrain_captures_total[6h]) == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "No captures ingested in the past 6 hours"
          description: >
            The capture pipeline has been silent for 6 hours. Possible causes:
            Cloudflare tunnel down (brain.troy-davis.com unreachable), core-api unhealthy,
            email Cloudflare Worker not routing, or no active user input.
            Check: GET https://brain.troy-davis.com/api/v1/captures?limit=5
            and core-api container logs via Grafana/Loki.
          runbook: "docs/runbooks/capture-flow-alert.md"
