# Prometheus alert rules — external integration quotas
# Metric source: openbrain_composio_monthly_usage gauge at core-api:3000/metrics
# Refreshed on every /metrics scrape (15s) from Redis key composio:monthly_usage:YYYY-MM.
#
# Notification path: ComposioClient.execute() sends Pushover on the exact call that crosses
# 15K (edge-triggered). These Prometheus rules add level-triggered monitoring so alerts
# fire even if the 15K crossing happened between Pushover checks, and provide Grafana
# annotation visibility.
#
# Thresholds match ComposioClient constants:
#   15000 = WARN_THRESHOLD (75% of 20K free tier)
#   19000 = HARD_STOP_THRESHOLD (95% of 20K free tier)
#
# Related code: packages/shared/src/services/composio-client.ts (quota meter)
#               packages/core-api/src/routes/metrics.ts (composioMonthlyUsage gauge)
#
# ALERT DELIVERY MODEL (corrected 2026-07-15 — the previous note here was STALE).
# Alertmanager IS configured and connected: the standalone observability stack
# (ADR-0004) runs `observability-alertmanager`, and Prometheus reports it under
# /api/v1/alertmanagers. It routes to Pushover — critical -> pushover-critical
# (priority 1, repeat 1h), warning -> pushover-warning (priority 0, repeat 4h).
# So these rules DO page.
#
# The old note ("...no alertmanager... manual observation only") was true of
# open-brain's own bundled Prometheus and became false when observability was split
# out; it was never updated. It is why a reader concluded these rules were
# decorative (#289).
#
# BUT — RULES IN THIS DIRECTORY ARE NOT DEPLOYED FROM HERE. The running Prometheus
# reads /mnt/user/appdata/observability/config/prometheus/alerts (that project's
# own, non-git-managed dir). This repo's copies are advisory and CAN drift. Editing
# a rule here does NOT change production until it is copied there and Prometheus is
# reloaded. See #292.
#
# Application-layer Pushover from workers skills / clients still exists and is
# independent of this path — some alerts intentionally have both.

groups:
  - name: open-brain-integration
    interval: 5m
    rules:
      - alert: ComposioQuotaWarning
        # Fires when Composio monthly usage reaches 15K (75% of 20K free tier limit).
        # At this level, ComposioClient has already sent a Pushover notification.
        # This Prometheus rule provides persistent Grafana visibility beyond the edge-trigger.
        expr: openbrain_composio_monthly_usage >= 15000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Composio usage at {{ $value }} / 20,000 (75% threshold)"
          description: >
            Composio API call count has crossed the 15K warning threshold for this calendar month.
            Hard stop at 19K (95%). Review which OpenClaw skills or workers are using Composio
            vs direct API. Per CLAUDE.md: reads + <50 calls/day → Composio; writes/bulk → direct API.
          runbook: "docs/runbooks/integration-alert.md"

      - alert: ComposioQuotaCritical
        # Fires when Composio monthly usage reaches 19K (95% of free tier limit).
        # ComposioClient.execute() will block new calls once this threshold is reached.
        expr: openbrain_composio_monthly_usage >= 19000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Composio quota at {{ $value }} / 19,000 hard stop"
          description: >
            Composio quota has reached the 95% hard-stop threshold.
            ComposioClient.execute() is now blocking new calls for the rest of the month.
            Identify the high-usage tool via Redis: redis-cli -p 6380 get "composio:monthly_usage:$(date +%Y-%m)"
            Switch to direct API alternatives for any bulk operations.
          runbook: "docs/runbooks/integration-alert.md"
