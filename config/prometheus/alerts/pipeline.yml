# Prometheus alert rules — BullMQ pipeline health
# Metric source: Pushgateway (job=open-brain, instance=workers)
# Metrics pushed by pipeline-health skill (every 6h): openbrain_queue_waiting,
# openbrain_queue_failed, openbrain_queue_active, openbrain_queue_delayed.
#
# Notification path: pipeline-health skill sends Pushover when waitingThreshold > 100
# and on stalled jobs. These Prometheus rules add the "sustained for >5 minutes" gate
# (Prometheus `for:` clause) and Grafana annotation visibility.
#
# Related code: packages/workers/src/skills/pipeline-health.ts
#               packages/workers/src/lib/push-metrics.ts (push path)
#
# ALERT DELIVERY MODEL (corrected 2026-07-15 — the previous note here was STALE).
# Alertmanager IS configured and connected: the standalone observability stack
# (ADR-0004) runs `observability-alertmanager`, and Prometheus reports it under
# /api/v1/alertmanagers. It routes to Pushover — critical -> pushover-critical
# (priority 1, repeat 1h), warning -> pushover-warning (priority 0, repeat 4h),
# unlabelled -> pushover-warning. So these rules DO page.
#
# The old note ("No Alertmanager is configured ... manual observation only") was
# true of open-brain's own bundled Prometheus and became false when observability
# was split out; it was never updated. It is the reason a reader concluded these
# rules were decorative (#289).
#
# BUT — RULES IN THIS DIRECTORY ARE NOT DEPLOYED FROM HERE. The running Prometheus
# reads /mnt/user/appdata/observability/config/prometheus/alerts (that project's
# own, non-git-managed dir). This repo's copies are advisory and CAN drift. Adding
# or editing a rule here does NOT change production until it is copied there and
# Prometheus is reloaded. See #292.
#
# Application-layer Pushover from workers skills (PushoverService) still exists and
# is independent of this path — some alerts intentionally have both.

groups:
  - name: open-brain-pipeline
    interval: 1m
    rules:
      - alert: QueueDepthHigh
        # Fires when any BullMQ queue has >100 waiting jobs for >5 consecutive minutes.
        # The `for: 5m` clause implements the card requirement "queue depth > 100 for >5min".
        expr: openbrain_queue_waiting{job="open-brain"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} depth {{ $value }} waiting jobs (>100 for 5+ min)"
          description: >
            BullMQ queue {{ $labels.queue }} has sustained >100 waiting jobs for over
            5 minutes. Workers may be stuck, under-resourced, or facing a thunderstorm.
            Check workers container logs and Redis queue state.
          runbook: "docs/runbooks/pipeline-alert.md"

      - alert: QueueFailedJobsHigh
        # Fires when accumulated failed jobs in a queue exceeds 5.
        # Failed jobs remain in the queue until manually resolved (BullMQ behavior).
        expr: openbrain_queue_failed{job="open-brain"} > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} has {{ $value }} failed jobs"
          description: >
            Accumulated failed jobs in {{ $labels.queue }} exceeds threshold.
            Jobs will be retried by the daily-sweep stale-capture re-queuer (03:00)
            but high failure counts indicate a systematic issue.
            Check workers logs via Grafana/Loki: {container_name="open-brain-workers-1"}.
          runbook: "docs/runbooks/pipeline-alert.md"
