# Prometheus alert rules — container health
# Metric source: Pushgateway (job=open-brain, instance=workers)
# Metrics pushed by container-health skill (every 15min):
#   openbrain_container_healthy{container} — 0 (unhealthy) or 1 (healthy)
#   openbrain_container_response_ms{container} — health check response time
#
# Notification path: container-health skill sends Pushover after N consecutive failures
# (default threshold: 3 = 45 minutes of consecutive failures). These Prometheus rules
# add early detection:
#   - ContainerDown: fires after 5 minutes of unhealthy state
#   - ContainerRestartLoop: fires immediately on rapid health state changes
#
# OOM kill detection: Docker OOM kills cause container restart → health check fails →
# openbrain_container_healthy drops to 0. `changes()` over 10m captures the 0→1→0
# oscillation pattern without requiring Docker stats API access.
#
# Related code: packages/workers/src/skills/container-health.ts
#               packages/workers/src/lib/push-metrics.ts (push path)
#
# ALERT DELIVERY MODEL: No Alertmanager is configured in this deployment
# (prometheus.yml has no alerting: block). These rules surface in the Prometheus
# Alerts tab and Grafana alert panels for manual observation only — they do NOT
# automatically dispatch notifications (email, Slack, PagerDuty, etc.).
# Operational push notifications are sent exclusively by application-layer code
# in the workers container (PushoverService / container-health.ts skill), at its
# own thresholds and on its own schedule, independently of these rules.

groups:
  - name: open-brain-container-health
    interval: 1m
    rules:
      - alert: ContainerDown
        # Fires when a container's health check has returned unhealthy for >5 minutes.
        # The container-health skill checks every 15 minutes; 5 minutes ensures we alert
        # on the first check failure (not requiring consecutive checks).
        expr: openbrain_container_healthy{job="open-brain"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} has been unhealthy for 5+ minutes"
          description: >
            Container {{ $labels.container }} health check is returning unhealthy.
            Check: docker ps (on homeserver), docker logs open-brain-{{ $labels.container }}-1 --tail 50
            Restart: docker compose restart {{ $labels.container }}
            If OOM: dmesg | grep oom-kill | tail -20
          runbook: "docs/runbooks/container-health-alert.md"

      - alert: ContainerRestartLoop
        # Fires when a container's health state changes more than 3 times in 10 minutes.
        # This catches crash-loop behavior (OOM kill → restart → healthy → OOM → restart).
        # Each 0→1 or 1→0 transition counts as one change; >3 = at least 2 full cycles.
        expr: changes(openbrain_container_healthy{job="open-brain"}[10m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container }} may be restart-looping ({{ $value }} state changes in 10m)"
          description: >
            Rapid health state changes in {{ $labels.container }} suggest a crash loop.
            OOM kill or config error is the most common cause.
            Check: dmesg | grep oom-kill; check container memory limits in docker-compose.yml.
            CLAUDE.md rule: all processes must stay below 1.5 GB RSS steady-state.
          runbook: "docs/runbooks/container-health-alert.md"
