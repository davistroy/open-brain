global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rule files — alert YAML files live alongside this config in alerts/
rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: "vllm-llm"
    metrics_path: /metrics
    static_configs:
      - targets: ["spark.k4jda.net:8000"]
        labels:
          model: "qwen3.5-35b"
          service: "llm"

  - job_name: "vllm-embed"
    metrics_path: /metrics
    static_configs:
      - targets: ["spark.k4jda.net:8001"]
        labels:
          model: "qwen3-embedding-4b"
          service: "embedding"

  - job_name: "spark-node"
    static_configs:
      - targets: ["spark.k4jda.net:9100"]

  - job_name: "spark-gpu"
    static_configs:
      - targets: ["spark.k4jda.net:9400"]

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: 'open-brain-core-api'
    static_configs:
      - targets: ['core-api:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
