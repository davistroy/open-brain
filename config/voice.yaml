# Open Brain Voice Configuration
# Used by packages/voice-pipecat — mounted at /app/config/voice.yaml

server:
  # WebSocket server for Pipecat audio streams
  websocket_port: 8765
  # FastAPI health endpoint
  health_port: 8766
  host: "0.0.0.0"

# Voice Activity Detection (Silero VAD — bundled with pipecat-ai[silero])
vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 300

# Speech-to-Text
stt:
  provider: deepgram
  model: nova-2
  language: en-US
  sample_rate: 16000
  encoding: linear16
  interim_results: true
  utterance_end_ms: 1000
  vad_events: true
  smart_format: true
  # API key: set DEEPGRAM_API_KEY env var (from Bitwarden)

# Text-to-Speech
# Providers: deepgram (cloud), kokoro (local), piper (local)
# Falls back to deepgram if local provider not installed
tts:
  provider: deepgram
  voice: aura-asteria-en
  sample_rate: 16000
  # Kokoro config (if provider: kokoro)
  kokoro_model: kokoro-v0_19
  kokoro_voice: af_heart
  # Piper config (if provider: piper)
  piper_model: en_US-lessac-medium

# LLM (Claude via Anthropic SDK)
llm:
  model: claude-sonnet-4-20250514
  max_tokens: 1024
  temperature: 0.7
  system_prompt: |
    You are Open Brain's voice assistant. You help the user capture thoughts,
    recall information, and think through ideas. Be concise and conversational.
    Speak naturally as if in a real-time conversation — keep responses short
    (1-3 sentences unless more detail is requested).

    You have access to the user's personal knowledge base. When relevant,
    reference past captures and entities to provide context-aware responses.
  # API key: set ANTHROPIC_API_KEY env var (from Bitwarden)

# Session management (Redis-backed)
session:
  ttl_seconds: 3600
  silence_timeout_seconds: 30.0
