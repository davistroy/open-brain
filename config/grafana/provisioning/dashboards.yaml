apiVersion: 1

providers:
  - name: 'Open Brain'
    orgId: 1
    folder: 'Open Brain'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/open-brain
      foldersFromFilesStructure: false
