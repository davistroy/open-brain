apiVersion: 1

# Grafana datasource provisioning — P11a
# Locks in UIDs so existing dashboards using ${DS_PROMETHEUS} work after container recreate.
# Loki datasource added for log exploration (P11a log driver wiring).
#
# Operator note: Loki URL uses container name "loki" — verify Grafana and the standalone
# Loki container share a Docker network. If not, change url to http://<homeserver-ip>:3100.

datasources:
  - name: Prometheus
    type: prometheus
    uid: DS_PROMETHEUS
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: DS_LOKI
    url: http://loki:3100
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
