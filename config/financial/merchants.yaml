  - Dining
  - Groceries
  - Gas/Fuel
  - Subscriptions
  - Travel
  - Household
  - Medical
  - Insurance
  - Utilities
  - Shopping
  - Entertainment
  - Professional
  - Transfers
  - Income
  - Uncategorized

