# --- Pattern Matches ---
# List of {pattern, category} applied in order. First match wins.
# Patterns are Python regex, applied with re.IGNORECASE.
pattern_matches:
  # Dining - broad restaurant patterns
  - pattern: "(?i)restaurant|grill|pizza|burger|taco|sushi|thai|chinese|bbq|barbecue|steakhouse|diner|cafe|coffee|bakery|deli|wings|seafood|buffet|cantina|bistro|pub|tavern|brewpub|brewery|taphouse|kitchen|eatery|chophouse"
    category: Dining

  # Gas/Fuel
  - pattern: "(?i)\\b(gas|fuel|petroleum|petro|sunoco|citgo|valero|phillips 66|conoco|texaco|sinclair|mobil)\\b"
    category: Gas/Fuel

  # Medical
  - pattern: "(?i)pharmacy|medical|doctor|hospital|dental|dentist|vision|optometrist|ophthalmol|urgent care|clinic|orthopedic|dermatol|cardiol|pediatr|chiropr|physical therapy|mental health|counseling|therapist"
    category: Medical

  # Travel
  - pattern: "(?i)hotel|motel|airline|airport|rental car|resort|inn|suites|lodge|travel|cruise|amtrak|greyhound|taxi|rideshare"
    category: Travel

  # Insurance
  - pattern: "(?i)\\b(insurance|insur|premium|underwriter|casualty|indemnity)\\b"
    category: Insurance

  # Groceries - catch additional grocery stores
  - pattern: "(?i)\\b(grocery|grocer|supermarket|fresh market|farmers market|food mart|meat market)\\b"
    category: Groceries

  # Subscriptions - streaming and SaaS patterns
  - pattern: "(?i)\\b(subscription|recurring|monthly fee|annual fee|membership dues)\\b"
    category: Subscriptions

  # Utilities
  - pattern: "(?i)\\b(electric|power company|energy|water authority|sewer|gas utility|telecom|broadband|internet service|cable tv|waste management|sanitation)\\b"
    category: Utilities

  # Entertainment
  - pattern: "(?i)\\b(cinema|theater|theatre|museum|zoo|aquarium|amusement|theme park|concert|festival|arcade|bowling|mini golf|escape room|laser tag|trampoline park)\\b"
    category: Entertainment

  # Professional
  - pattern: "(?i)\\b(consulting|accountant|attorney|lawyer|legal|notary|tax prep|cpa|bookkeep|payroll)\\b"
    category: Professional

  # Transfers
  - pattern: "(?i)\\b(transfer|ach|wire|direct deposit|autopay|payment to|payment from|fund transfer)\\b"
    category: Transfers

