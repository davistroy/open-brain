# Merchant Categorization Engine for Open Brain Financial Pipeline
# Resolution order: exact_matches -> pattern_matches -> plaid_category_map -> "Uncategorized"
#
# Categories are Open Brain financial categories (not Plaid categories).
# Exact matches are case-insensitive lookups on merchant_name from Plaid.
# Pattern matches use Python regex (re.IGNORECASE implied).
# Plaid category map translates Plaid personal_finance_category to OB category.

# --- Open Brain Financial Categories ---
