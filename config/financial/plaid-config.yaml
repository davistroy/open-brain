# Plaid Financial Integration Configuration
# Used by: scripts/plaid-link-server.py, scripts/financial-pipeline.py

# Plaid API environment
# Options: sandbox, development, production
# Development: free, 100 items, real bank data
environment: development

# Plaid products to request during Link
products:
  - transactions
  - balance
  - investments

# ISO country codes for Plaid Link
country_codes:
  - US

# Linked financial accounts
# key: short identifier used in scripts and captures
# name: display name for reports and captures
# type: account category (credit, checking, brokerage, hsa, payment)
# institution: bank/provider name
accounts:
  amex:
    name: "American Express"
    type: credit
    institution: American Express
  chase:
    name: "Chase"
    type: credit
    institution: JPMorgan Chase
  truist:
    name: "Truist Checking"
    type: checking
    institution: Truist
  schwab:
    name: "Charles Schwab"
    type: brokerage
    institution: Charles Schwab
  hsa:
    name: "HSA Bank"
    type: hsa
    institution: HSA Bank
  paypal:
    name: "PayPal"
    type: payment
    institution: PayPal

# Bitwarden secret references (retrieved via bws CLI)
# These are the Bitwarden Secrets Manager secret names, NOT the values
bitwarden_keys:
  # Canonical Bitwarden names (UPPERCASE_UNDERSCORE, matching GAS_SOUTH_*/PUSHOVER_*).
  # NOTE: these 3 secrets must still be PROVISIONED in Bitwarden — they do not exist
  # under any name yet. tokens is a JSON blob: {"amex":"access-...","chase":"...", ...}
  client_id_key: "PLAID_CLIENT_ID"
  secret_key: "PLAID_SECRET"
  tokens_key: "PLAID_ACCESS_TOKENS"

# Open Brain capture API
capture_api:
  url: "https://brain.troy-davis.com/api/v1/captures"
  caller_header: "financial-pipeline"

# Account health monitoring — used by --account-monitoring flag
monitoring:
  # Balance change alerts
  balance_drop_pct: 20.0        # alert if any account drops > N% day-over-day
  balance_drop_abs: 500.0       # alert if any account drops > $N day-over-day (absolute)
  credit_utilization_pct: 80.0  # alert if credit utilization exceeds N%

  # Investment position alerts
  position_change_pct: 10.0     # alert if any single holding moves > N% week-over-week
  portfolio_drop_pct: 5.0       # alert if total portfolio value drops > N% week-over-week

  # Anomaly detection — 30-day rolling window
  anomaly_sigma: 2.5            # flag balance if current deviates > N standard deviations from 30d mean
  anomaly_min_history_days: 7   # skip anomaly check if fewer than N days of history exist

  # Net worth tracking
  net_worth_drop_pct: 5.0       # alert if net worth drops > N% day-over-day

  # Capture behavior
  post_capture_on_alert: true   # always post a capture when alerts fire
  post_daily_capture: true      # post a monitoring summary capture even when no alerts
