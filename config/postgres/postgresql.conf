# PostgreSQL configuration for Open Brain — development
# Tuned for Intel i7-9700 / 128GB RAM host, ~8GB container memory limit

# Memory
shared_buffers = 2GB
effective_cache_size = 6GB
# Coupled to the postgres service's shm_size (docker-compose.yml, 1gb): pgvector's parallel
# HNSW build sizes a /dev/shm segment from maintenance_work_mem alone (this value minus 3MB).
# A session with max_parallel_maintenance_workers=0 builds in private memory and needs no
# segment (scripts/lib/restore-core.sh restores that way); any non-zero worker count still
# allocates the full segment, so lowering it to 1 does NOT help.
# Raising this past ~1GB without raising shm_size breaks a parallel CREATE INDEX.
maintenance_work_mem = 512MB
work_mem = 64MB

# Connections
listen_addresses = '*'
max_connections = 50

# WAL
wal_level = replica
wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging — emit slow queries (>1s) for analysis
log_min_duration_statement = 1000

# Sessions — end a session left idle inside a transaction after 5 min. A crashed or hung client
# otherwise pins locks and blocks vacuum indefinitely. No global statement_timeout: workers
# (consolidation, retention, re-embed) and pg_dump run statements longer than any sane global
# limit; core-api sets a 60 s statement_timeout on its own pool instead.
idle_in_transaction_session_timeout = 5min
