# electric-usage-downloader configuration template
# Copy this to ~/.electric-usage-downloader/config.yaml on open-brain-vm
# Then fill in username/password from Bitwarden (dev/open-brain/cobb-emc)
#
# Tool: https://github.com/tedpearson/electric-usage-downloader
# Docs: see README in the GitHub repo for all config options

# SmartHub connection for Cobb EMC
smarthub:
  url: cobbemc.smarthub.coop
  # Retrieve from Bitwarden: bws secret get <secret-id> | jq -r .value
  # Or: bws secret list | grep cobb-emc
  username: "FILL_FROM_BITWARDEN"          # SmartHub login email
  password: "FILL_FROM_BITWARDEN"          # SmartHub login password

# Output settings
output:
  directory: ~/.electric-usage             # CSV files written here, one per day
  format: csv                              # csv or json

# Timezone for interpreting 15-minute interval timestamps
timezone: America/New_York
