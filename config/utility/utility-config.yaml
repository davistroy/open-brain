# Utility pipeline configuration for Open Brain
# Used by scripts/utility-pipeline.py on open-brain-vm (192.168.10.53)
# All credentials stored in Bitwarden — never in this file.

power:
  provider: cobb_emc
  tool: electric-usage-downloader   # open-source Go binary (github.com/tedpearson/electric-usage-downloader)
  smarthub_url: cobbemc.smarthub.coop
  bitwarden_key: dev/open-brain/cobb-emc   # SmartHub username + password
  data_dir: ~/.electric-usage              # where the Go tool writes CSV output
  output_format: csv
  rate_kwh: 0.12                           # approximate $/kWh for cost estimates (update from bill)
  cron: "0 4 * * *"                        # daily 4 AM — pull previous day's 15-min data

water:
  provider: cobb_county_water
  api_url: https://ccw-csswebapi.cobbcounty.org/api
  account_id: "100101623"
  service_id: S0228354
  # No auth required (confirmed via HAR analysis). If API starts returning 401,
  # implement session cookie from portal login at https://ccw-css.cobbcounty.org/
  cron: "0 5 2 * *"                        # 2nd of month, 5 AM

gas:
  provider: gas_south
  api_url: https://manage-api.gassouth.com/oas/api   # OASUrl() — data host (get-account-activity)
  # Auth is a SEPARATE host from the data API (the portal SPA's AuthUrl()).
  # Login: POST {auth_url}/api/authenticate/aup {UserName,Password,startIdx,endIdx} -> {AuthToken,...}.
  # This is an Azure App Service default hostname — if login starts 404ing again,
  # re-capture it from manage.gassouth.com's main-*.js bundle (grep `authUrl:`). (#265)
  auth_url: https://oas-1-auth-dehgctgqg2e9c8ee.eastus-01.azurewebsites.net
  # REQUIRED header on the auth call — without it the auth host returns a generic
  # HTTP 400 BEFORE evaluating credentials (verified against the live endpoint).
  # Public constant baked into the portal bundle (`ClientId:` in main-*.js), not a
  # secret — it identifies the web client, not the user. Re-capture alongside auth_url.
  client_id: GS-5E027899-FB73-47B2-8E23-AA0985EF4B82
  account_number: "2585622233"
  # Two SEPARATE Bitwarden secrets (canonical), not a single JSON blob.
  bitwarden_username_key: GAS_SOUTH_USERNAME
  bitwarden_password_key: GAS_SOUTH_PASSWORD
  login_url: https://manage.gassouth.com     # portal origin (Origin/Referer headers only)
  lookback_months: 3                        # how many months of billing history to fetch
  cron: "0 5 2 * *"                         # 2nd of month, 5 AM (same as water)

capture_api:
  url: https://brain.troy-davis.com/api/v1/captures
  caller_header: utility-pipeline           # for rate-limit bypass (add to BYPASS_CALLERS Set)

alert_thresholds:
  # Month-over-month percentage increase that triggers an alert in the capture
  power_mom_pct: 20
  gas_mom_pct: 20
  water_mom_pct: 30
