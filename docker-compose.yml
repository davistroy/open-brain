networks:
  open-brain:
    driver: bridge
  # Shared fleet observability stack (homeserver/observability compose project).
  # open-brain joins as a CLIENT: the shared Prometheus scrapes core-api:3000 and
  # workers push to pushgateway:9091. Must exist at deploy time (it does on the
  # homeserver); see docs/adr/ADR-0004-observability-repoint.md.
  observability:
    external: true

volumes:
  postgres_data:
  redis_data:
  whisper_model_cache:
  financial_ingest_data:
  utility_ingest_data:
  admin_prewipe_backup:
  voice_spool_data:   # INT-M4: durable dead-letter spool for voice transcripts

# Shared Loki logging (PLT-H3 + PE-L5):
#  - loki-url default = localhost (the Docker log driver runs in the DAEMON, which
#    can't resolve compose DNS like `loki:3100`; Loki binds 127.0.0.1:3100 per
#    ADR-0002, so localhost IS daemon-reachable). Homeserver .env LOKI_URL must
#    also be localhost (not the old external hostname — Loki is loopback-only now).
#  - mode: non-blocking so a slow/down Loki never back-pressures container stdout.
x-logging: &default_logging
  driver: loki
  options:
    loki-url: "${LOKI_URL:-http://localhost:3100/loki/api/v1/push}"
    loki-batch-size: "400"
    loki-retries: "3"
    loki-max-backoff: "800ms"
    loki-timeout: "2s"
    mode: "non-blocking"
    max-buffer-size: "4m"
    loki-pipeline-stages: |
      - json:
          expressions:
            level: level
            name: name
            msg: msg
      - labels:
          level:
          name:

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: open-brain-postgres
    environment:
      POSTGRES_DB: openbrain
      POSTGRES_USER: openbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see deploy/.env.secrets.template}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbrain -d openbrain"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 8g
    cpus: '4'
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  redis:
    image: redis:7.4-alpine
    container_name: open-brain-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    # requirepass (SEC-08) + bounded memory with noeviction (PE-M3): BullMQ enqueue
    # must fail loudly under back-pressure, never silently evict job state.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set — see deploy/.env.secrets.template} --maxmemory 400mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  core-api:
    image: ghcr.io/davistroy/open-brain/core-api:latest
    build:
      context: .
      target: core-api
    container_name: open-brain-core-api
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_URL: postgresql://openbrain:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_BASE_URL: https://api.openai.com/v1
      OLLAMA_URL: http://ollama:11434/v1
      WIKI_REPO_URL: http://Gitea:3000/davistroy/open-brain-wiki.git
      WIKI_LOCAL_PATH: /tmp/open-brain-wiki
      GITEA_TOKEN: ${GITEA_TOKEN}
      NODE_OPTIONS: "--max-old-space-size=1200"
      # Himalaya TOML config lives on the mounted config volume. Credentials live
      # inside the TOML file (gitignored; sourced from Bitwarden BOND_EMAIL_PASSWORD).
      HIMALAYA_CONFIG: /app/config/himalaya/config.toml
      # OPENAI_API_KEY: set in .env.secrets
      # MCP_API_KEY: set in .env.secrets
      # ADMIN_API_KEY: set in .env.secrets (protects admin endpoints; falls back to MCP_BEARER_TOKEN)
      # SLACK_USER_TOKEN: set in .env.secrets (xoxp-... user token for channel cleanup — requires channels:history, chat:write scopes)
      # VOICE_CAPTURE_SECRET: set in .env.secrets (INT-M5 — forwarded as Bearer to voice-capture by the /api/v1/voice-captures proxy)
    ports:
      # Dual-bind (ADR-0002): loopback for host + Tailscale IP for OpenClaw MCP
      # (bond.k4jda.net → 100.101.61.122:3002/mcp). NOT 0.0.0.0 — closes the LAN.
      - "127.0.0.1:3002:3000"
      - "${TAILSCALE_IP:-100.101.61.122}:3002:3000"
    volumes:
      - ./config:/app/config:ro
      - admin_prewipe_backup:/backup/pre-wipe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 1500m
    cpus: '2'
    networks:
      - open-brain
      - observability        # shared Prometheus scrapes core-api:3000/metrics (ADR-0004)
    restart: unless-stopped
    logging: *default_logging

  workers:
    image: ghcr.io/davistroy/open-brain/workers:latest
    build:
      context: .
      target: workers
    container_name: open-brain-workers
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgresql://openbrain:${POSTGRES_PASSWORD}@postgres:5432/openbrain
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_BASE_URL: https://api.openai.com/v1
      OLLAMA_URL: http://ollama:11434/v1
      CORE_API_URL: http://core-api:3000
      OPEN_BRAIN_API_URL: http://core-api:3000
      WIKI_REPO_URL: http://Gitea:3000/davistroy/open-brain-wiki.git
      WIKI_LOCAL_PATH: /tmp/open-brain-wiki
      GITEA_TOKEN: ${GITEA_TOKEN}
      NODE_OPTIONS: "--max-old-space-size=1200"
      # wiki-ingest makes git commits from inside this container; env vars
      # override lack of ~/.gitconfig and identify the bot author (A61).
      GIT_AUTHOR_NAME: "Open Brain Bot"
      GIT_AUTHOR_EMAIL: "bot@brain.troy-davis.com"
      GIT_COMMITTER_NAME: "Open Brain Bot"
      GIT_COMMITTER_EMAIL: "bot@brain.troy-davis.com"
      PIPELINE_USE_FLOWS: "true"  # DAG pipeline is now the only code path; kept for documentation
      # Outbound email primary path — himalaya CLI with TOML config (gitignored;
      # credentials sourced from Bitwarden BOND_EMAIL_PASSWORD). Weekly brief and
      # email-compose skill call HimalayaService.send().
      HIMALAYA_CONFIG: /app/config/himalaya/config.toml
      # COMPOSIO_API_KEY: set in .env.secrets (Composio MCP — calendar, email integrations)
      # OPENAI_API_KEY: set in .env.secrets
      # LLM_SPEND_URL: set in .env.secrets (optional — spend proxy for budget-check)
      # PUSHOVER_APP_TOKEN: set in .env.secrets
      # PUSHOVER_USER_KEY: set in .env.secrets
      # Optional nodemailer fallback for weekly-brief (Himalaya -> nodemailer -> Pushover chain).
      # Currently unset — delivery cascades directly from Himalaya to Pushover.
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_FROM: set in .env.secrets to enable
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness (PLT-H2/M6): confirms the container's node runtime responds — a
      # dead/hung container fails the exec. The real "workers stopped pushing
      # metrics" detector is the Prometheus PushgatewayStale / WorkersMetricsAbsent
      # rules (a wedged event loop can still pass this probe).
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1500m
    cpus: '3'
    networks:
      - open-brain
      - observability        # workers push metrics to the shared pushgateway:9091 (ADR-0004)
    restart: unless-stopped
    logging: *default_logging

  slack-bot:
    image: ghcr.io/davistroy/open-brain/slack-bot:latest
    build:
      context: .
      target: slack-bot
    container_name: open-brain-slack-bot
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      CORE_API_URL: http://core-api:3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_BASE_URL: https://api.openai.com/v1
      NODE_OPTIONS: "--max-old-space-size=1200"
      # SLACK_BOT_TOKEN: set in .env.secrets   (xoxb-...)
      # SLACK_APP_TOKEN: set in .env.secrets   (xapp-...)
      # OPENAI_API_KEY: set in .env.secrets
    volumes:
      - ./config:/app/config:ro
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      # Liveness (PLT-M6): node runtime responds. slack-bot is Socket Mode (no HTTP
      # endpoint to probe); a dead/hung container fails the exec.
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1500m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  voice-pipecat:
    image: ghcr.io/davistroy/open-brain/voice-pipecat:latest
    build:
      context: packages/voice-pipecat
      dockerfile: Dockerfile
    container_name: open-brain-voice-pipecat
    env_file:
      - .env.secrets
    environment:
      # DEEPGRAM_API_KEY: set in .env.secrets
      # ANTHROPIC_API_KEY: set in .env.secrets
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORE_API_URL: http://core-api:3000
    ports:
      - "8765:8765"   # WebSocket for Pipecat audio streams
      - "8766:8766"   # Health endpoint
    volumes:
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8766/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 4g
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # Ollama runs as standalone container — connected via scripts/post-compose-up.sh
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: open-brain-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #   mem_limit: 16g
  #   networks:
  #     - open-brain
  #   restart: unless-stopped

  file-ingestion:
    image: ghcr.io/davistroy/open-brain/file-ingestion:latest
    build:
      context: packages/file-ingestion
      dockerfile: Dockerfile
    container_name: open-brain-file-ingestion
    environment:
      PORT: "8080"
      LOG_LEVEL: "INFO"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${STAGING_DIR:-/mnt/user/openbrain/staging}:/data/staging:ro
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 1536m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # --- Legacy voice services (kept for fallback until voice-pipecat is validated) ---

  faster-whisper:
    image: fedirz/faster-whisper-server:0.5.0-cpu
    container_name: open-brain-faster-whisper
    environment:
      WHISPER__MODEL: large-v3
      WHISPER__DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
    ports:
      - "127.0.0.1:10300:8000"
    volumes:
      - whisper_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 8g
    cpus: '4'
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  voice-capture:
    image: ghcr.io/davistroy/open-brain/voice-capture:latest
    build:
      context: .
      target: voice-capture
    container_name: open-brain-voice-capture
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      PORT: "3001"
      CORE_API_URL: http://core-api:3000
      WHISPER_URL: http://faster-whisper:8000
      OPENAI_BASE_URL: https://api.openai.com/v1
      NODE_OPTIONS: "--max-old-space-size=1200"
      # OPENAI_API_KEY: set in .env.secrets
      # PUSHOVER_TOKEN: set in .env.secrets
      # PUSHOVER_USER: set in .env.secrets
      # VOICE_CAPTURE_SECRET: set in .env.secrets (INT-M5 Bearer auth on /api/capture;
      #   warn-and-allow if unset — two-phase rollout). Port stays LAN per D132/Option 1
      #   (live iOS Shortcut posts here directly); 8.2 loopback bind deferred to ops backlog.
    ports:
      - "3001:3001"
    volumes:
      # SE-13: brain-views.yaml is read for brain_view validation (lightweight,
      # like slack-bot). Read-only — voice-capture never writes config.
      - ./config:/app/config:ro
      # INT-M4: durable spool for dead-lettered transcripts (survives restart).
      - voice_spool_data:/data/voice-spool
    depends_on:
      core-api:
        condition: service_healthy
      faster-whisper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 1500m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  web-next:
    image: ghcr.io/davistroy/open-brain/web-next:latest
    build:
      context: .
      dockerfile: packages/web-next/Dockerfile
    container_name: open-brain-web-next
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      # TZ: ensures getHours() in RSC server code matches the user's timezone,
      # preventing SSR/CSR hydration mismatches (e.g. greeting, date headers).
      TZ: America/New_York
      # API_URL: used by next.config.ts rewrites (server-side, not browser-exposed)
      API_URL: http://core-api:3000
      # NEXT_PUBLIC_API_URL: browser-visible URL — intentionally empty in Docker;
      # all /api calls are proxied server-side via next.config.ts rewrites
      NEXT_PUBLIC_API_URL: http://core-api:3000
    ports:
      - "3003:3001"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/dashboard || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # mem_limit (not deploy.resources, which `docker compose` ignores outside
    # swarm — PLT-L2): matches every other service and actually takes effect.
    mem_limit: 512m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  cloudflared:
    image: cloudflare/cloudflared:2025.6.1
    container_name: open-brain-cloudflared
    # --metrics exposes /ready + /metrics (PLT-H2/M6). No CMD healthcheck: the
    # cloudflared image is distroless (no shell for CMD-SHELL); tunnel liveness is
    # covered by the external synthetic monitor (health.troy-davis.com).
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 --config /etc/cloudflared/tunnel.yaml run
    environment:
      # CLOUDFLARE_TUNNEL_TOKEN: set in .env.secrets
      # Retrieve from Bitwarden before starting: bws secret get <open-brain-cloudflare-tunnel-token>
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./config/cloudflare/tunnel.yaml:/etc/cloudflared/tunnel.yaml:ro
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # Python batch-ingest sidecar — hosts financial-pipeline.py + utility-pipeline.py.
  # Long-lived container; host cron shells in with `docker exec` to run tasks.
  # Replaces the per-script deployment on open-brain-vm (G-C.0 decision: Python
  # sidecar on homeserver, not TS rewrite).
  financial-ingest:
    image: ghcr.io/davistroy/open-brain/ingest-sidecar:latest
    build:
      context: .
      dockerfile: docker/ingest-sidecar/Dockerfile
    container_name: open-brain-financial-ingest
    env_file:
      - .env.secrets
    environment:
      # BWS_ACCESS_TOKEN set in .env.secrets — required for bws secret list
      # INGEST_TRIGGER_SECRET set in .env.secrets — HMAC for core-api dispatch
      INGEST_SOURCE: financial  # binds trigger_server.py to financial-pipeline.py
      FINANCIAL_INBOX_DIR: /inbox
      FINANCIAL_PIPE_DIR: /data
      FINANCIAL_CONFIG_DIR: /app/config/financial
      # Post captures to core-api over the internal Docker network, not via
      # the public brain.troy-davis.com URL. Public URL is fronted by
      # Cloudflare Access which 302s unauthenticated POSTs.
      CAPTURE_API_URL: http://core-api:3000/api/v1/captures
      CAPTURE_API_CALLER: financial-pipeline
      TZ: America/New_York
    volumes:
      # Host inbox — drop CSVs here and they'll be processed on next cron run.
      # Matches backup-path convention under /mnt/user/appdata on Unraid host.
      - /mnt/user/appdata/open-brain/financial-inbox:/inbox
      # SQLite DB + any future sidecar state
      - financial_ingest_data:/data
      # Config (plaid-config.yaml, merchants.yaml) read-only
      - ./config:/app/config:ro
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 1500m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # Utility batch-ingest sidecar — same image as financial-ingest, different
  # config + inbox. Handles utility-pipeline.py (gas, power, water summaries).
  # Build block is duplicated so either service can rebuild the shared image.
  utility-ingest:
    image: ghcr.io/davistroy/open-brain/ingest-sidecar:latest
    build:
      context: .
      dockerfile: docker/ingest-sidecar/Dockerfile
    container_name: open-brain-utility-ingest
    env_file:
      - .env.secrets
    environment:
      # INGEST_TRIGGER_SECRET set in .env.secrets — HMAC for core-api dispatch
      INGEST_SOURCE: utility  # binds trigger_server.py to utility-pipeline.py
      UTILITY_INBOX_DIR: /inbox
      UTILITY_PIPE_DIR: /data
      UTILITY_CONFIG_DIR: /app/config/utility
      CAPTURE_API_URL: http://core-api:3000/api/v1/captures
      CAPTURE_API_CALLER: utility-pipeline
      TZ: America/New_York
    volumes:
      - /mnt/user/appdata/open-brain/utility-inbox:/inbox
      - utility_ingest_data:/data
      - ./config:/app/config:ro
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 1500m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging
