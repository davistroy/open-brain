networks:
  open-brain:
    driver: bridge
  # Shared fleet observability stack (homeserver/observability compose project).
  # open-brain joins as a CLIENT: the shared Prometheus scrapes core-api:3000 and
  # workers push to pushgateway:9091. Must exist at deploy time (it does on the
  # homeserver); see docs/adr/ADR-0004-observability-repoint.md.
  observability:
    external: true
  # macvlan network (Unraid-managed). actual-ingest (#311) is dual-homed onto br0
  # to reach the Actual server — a macvlan container the host itself cannot route
  # to, so neither can a plain bridge container (spec §3.1).
  #
  # 🚨 MUST be external: true. Compose NEVER creates or removes an external
  # network — which is the ONLY thing protecting the five UNOWNED br0 containers
  # (AdGuard = LAN DNS, swag = all TLS, Gitea, …) from a `compose down` deleting
  # br0 out from under them. NEVER declare br0 with ipam/gateway/mac_address, and
  # NEVER `compose down` on a file that owns this network. (See homeserver plan
  # correction #15 / WI-7.2.)
  br0:
    external: true
    name: br0

volumes:
  postgres_data:
  redis_data:
  whisper_model_cache:  # #301: retained for rollback to the pre-speaches image
  hf_hub_cache:         # #301: speaches HF hub cache at /home/ubuntu/.cache/huggingface/hub
  financial_ingest_data:
  utility_ingest_data:
  admin_prewipe_backup:
  voice_spool_data:   # INT-M4: durable dead-letter spool for voice transcripts
  actual_ingest_data: # #311: Actual budget dataDir + last-run balance state (actual-ingest)

# Shared Loki logging (PLT-H3 + PE-L5):
#  - loki-url default = localhost (the Docker log driver runs in the DAEMON, which
#    can't resolve compose DNS like `loki:3100`; Loki binds 127.0.0.1:3100 per
#    ADR-0002, so localhost IS daemon-reachable). Homeserver .env LOKI_URL must
#    also be localhost (not the old external hostname — Loki is loopback-only now).
#  - mode: non-blocking so a slow/down Loki never back-pressures container stdout.
x-logging: &default_logging
  driver: loki
  options:
    loki-url: "${LOKI_URL:-http://localhost:3100/loki/api/v1/push}"
    loki-batch-size: "400"
    loki-retries: "3"
    loki-max-backoff: "800ms"
    loki-timeout: "2s"
    mode: "non-blocking"
    max-buffer-size: "4m"
    loki-pipeline-stages: |
      - json:
          expressions:
            level: level
            name: name
            msg: msg
      - labels:
          level:
          name:

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: open-brain-postgres
    env_file:
      - .env.secrets
    environment:
      POSTGRES_DB: openbrain
      POSTGRES_USER: openbrain
      # POSTGRES_PASSWORD arrives via env_file: .env.secrets (#281/D145) — no longer
      # interpolated (which .env.secrets can't feed), so a rebuilt host boots from
      # load-secrets.sh alone. The postgres image fails loudly on a FRESH init if it is
      # empty; on an existing data dir it is ignored (password already in the DB).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbrain -d openbrain"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 8g
    cpus: '4'
    # Must exceed the DSM segment a parallel HNSW build sizes from maintenance_work_mem
    # (512MB, config/postgres/postgresql.conf); Docker's 64m default silently breaks
    # pg_restore's CREATE INDEX → a restored DB with no HNSW index and no obvious error.
    shm_size: 1gb
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  redis:
    image: redis:7.4-alpine
    container_name: open-brain-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env.secrets
    # requirepass (SEC-08) + bounded memory with noeviction (PE-M3): BullMQ enqueue
    # must fail loudly under back-pressure, never silently evict job state.
    # #281/D145: REDIS_PASSWORD arrives via env_file (not interpolation, which
    # .env.secrets can't feed). The `sh -c` wrapper lets the CONTAINER shell expand
    # $$REDIS_PASSWORD ($$ → literal $, so compose does not interpolate at parse time);
    # the non-empty guard preserves the fail-loud behavior the old `:?` gave — redis
    # must never start without auth. `exec` keeps redis as PID 1 for signal handling.
    command: ["sh", "-c", "test -n \"$$REDIS_PASSWORD\" || { echo 'FATAL: REDIS_PASSWORD is empty, refusing to start redis without auth (#281/D145)' >&2; exit 1; }; exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 400mb --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  core-api:
    image: ghcr.io/davistroy/open-brain/core-api:latest
    build:
      context: .
      target: core-api
    container_name: open-brain-core-api
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      PORT: "3000"
      # POSTGRES_URL + REDIS_URL arrive via env_file: .env.secrets (synthesized by
      # load-secrets.sh, #281/D145) — NOT interpolated here (which .env.secrets can't
      # feed) and NOT re-declared as `environment:` (which would OVERRIDE the env_file
      # value — the GITEA_TOKEN clobber described above).
      OPENAI_BASE_URL: https://api.openai.com/v1
      OLLAMA_URL: http://ollama:11434/v1
      WIKI_REPO_URL: http://Gitea:3000/davistroy/open-brain-wiki.git
      WIKI_LOCAL_PATH: /tmp/open-brain-wiki
      # GITEA_TOKEN comes from `env_file: .env.secrets` above — do NOT re-declare it.
      # `environment:` OVERRIDES `env_file:`, and interpolation reads only the shell +
      # `.env`, never `.env.secrets`. So `GITEA_TOKEN: ${GITEA_TOKEN}` CLOBBERED the
      # correct value with "" whenever `.env` lacked it — i.e. after any DR rebuild,
      # since load-secrets.sh writes `.env.secrets` and never `.env`. Proven: with the
      # line -> GITEA_TOKEN=""; without it -> the env_file value survives. (#281)
      NODE_OPTIONS: "--max-old-space-size=1200"
      # Himalaya TOML config lives on the mounted config volume. Credentials live
      # inside the TOML file (gitignored; sourced from Bitwarden BOND_EMAIL_PASSWORD).
      HIMALAYA_CONFIG: /app/config/himalaya/config.toml
      # OPENAI_API_KEY: set in .env.secrets
      # MCP_API_KEY: set in .env.secrets
      # ADMIN_API_KEY: set in .env.secrets (protects admin endpoints; falls back to MCP_BEARER_TOKEN)
      # SLACK_USER_TOKEN: set in .env.secrets (xoxp-... user token for channel cleanup — requires channels:history, chat:write scopes)
      # VOICE_CAPTURE_SECRET: set in .env.secrets (INT-M5 — forwarded as Bearer to voice-capture by the /api/v1/voice-captures proxy)
    ports:
      # Dual-bind (ADR-0002): loopback for host + Tailscale IP for OpenClaw MCP
      # (bond.k4jda.net → 100.101.61.122:3002/mcp). NOT 0.0.0.0 — closes the LAN.
      - "127.0.0.1:3002:3000"
      - "${TAILSCALE_IP:-100.101.61.122}:3002:3000"
    volumes:
      - ./config:/app/config:ro
      - admin_prewipe_backup:/backup/pre-wipe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 1500m
    cpus: '2'
    networks:
      - open-brain
      - observability        # shared Prometheus scrapes core-api:3000/metrics (ADR-0004)
    restart: unless-stopped
    logging: *default_logging

  workers:
    image: ghcr.io/davistroy/open-brain/workers:latest
    build:
      context: .
      target: workers
    container_name: open-brain-workers
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      # POSTGRES_URL + REDIS_URL arrive via env_file: .env.secrets (synthesized by
      # load-secrets.sh, #281/D145) — NOT interpolated here (which .env.secrets can't
      # feed) and NOT re-declared as `environment:` (which would OVERRIDE the env_file
      # value — the GITEA_TOKEN clobber described above).
      OPENAI_BASE_URL: https://api.openai.com/v1
      OLLAMA_URL: http://ollama:11434/v1
      CORE_API_URL: http://core-api:3000
      OPEN_BRAIN_API_URL: http://core-api:3000
      # Morning-brief Slack destination (#344). Previously set ONLY in `.env`, which is
      # a compose interpolation source and never reaches the container — so workers saw
      # undefined, morning-brief.ts resolved '', and the brief's Slack post was silently
      # skipped for months (A145). It is a non-secret config value, delivered here.
      MORNING_BRIEF_SLACK_CHANNEL: "D0AR39RNG4E"
      WIKI_REPO_URL: http://Gitea:3000/davistroy/open-brain-wiki.git
      WIKI_LOCAL_PATH: /tmp/open-brain-wiki
      # GITEA_TOKEN comes from `env_file: .env.secrets` above — do NOT re-declare it.
      # `environment:` OVERRIDES `env_file:`, and interpolation reads only the shell +
      # `.env`, never `.env.secrets`. So `GITEA_TOKEN: ${GITEA_TOKEN}` CLOBBERED the
      # correct value with "" whenever `.env` lacked it — i.e. after any DR rebuild,
      # since load-secrets.sh writes `.env.secrets` and never `.env`. Proven: with the
      # line -> GITEA_TOKEN=""; without it -> the env_file value survives. (#281)
      NODE_OPTIONS: "--max-old-space-size=1200"
      # wiki-ingest makes git commits from inside this container; env vars
      # override lack of ~/.gitconfig and identify the bot author (A61).
      GIT_AUTHOR_NAME: "Open Brain Bot"
      GIT_AUTHOR_EMAIL: "bot@brain.troy-davis.com"
      GIT_COMMITTER_NAME: "Open Brain Bot"
      GIT_COMMITTER_EMAIL: "bot@brain.troy-davis.com"
      PIPELINE_USE_FLOWS: "true"  # DAG pipeline is now the only code path; kept for documentation
      OPERATOR_ACTIONS_PATH: /app/OPERATOR_ACTIONS.md  # RC-19 register (mounted below); secret-rotation skill reads it
      # Outbound email primary path — himalaya CLI with TOML config (gitignored;
      # credentials sourced from Bitwarden BOND_EMAIL_PASSWORD). Weekly brief and
      # email-compose skill call HimalayaService.send().
      HIMALAYA_CONFIG: /app/config/himalaya/config.toml
      # COMPOSIO_API_KEY: set in .env.secrets (Composio MCP — calendar, email integrations)
      # OPENAI_API_KEY: set in .env.secrets
      # BWS_ACCESS_TOKEN: set in .env.secrets (RC-13) — bootstrap token the monthly
      #   secret-rotation skill uses for `bws secret list` staleness checks. Arrives
      #   via env_file above; NOT in secrets-map.sh (it authenticates to Bitwarden, so
      #   it cannot be fetched from Bitwarden). Unset = staleness check skipped.
      # LLM_SPEND_URL: set in .env.secrets (optional — spend proxy for budget-check)
      # PUSHOVER_APP_TOKEN: set in .env.secrets
      # PUSHOVER_USER_KEY: set in .env.secrets
      # Optional nodemailer fallback for weekly-brief (Himalaya -> nodemailer -> Pushover chain).
      # Currently unset — delivery cascades directly from Himalaya to Pushover.
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_FROM: set in .env.secrets to enable
      # Backup dead-man's switch (7.4/PE-H4/RC-12/SA-13/A131) — pipeline-health
      # stats this path's mtime every 6h and pushes openbrain_backup_age_seconds.
      # Deferred to the next workers recreate (batched compose window, OA-9) —
      # inert until then; pipeline-health gracefully skips when the mount is absent.
      BACKUP_LATEST_PATH: /backup-latest/manifest.json
    volumes:
      - ./config:/app/config:ro
      - ./OPERATOR_ACTIONS.md:/app/OPERATOR_ACTIONS.md:ro  # RC-19 dated register for secret-rotation reminders
      # ro-mount of the host backup 'latest' symlink target — see BACKUP_LATEST_PATH above.
      # Host path is Unraid-specific (scripts/backup.sh BACKUP_ROOT default); absent in
      # local dev/CI, which is fine — pipeline-health treats a missing mount as "skip".
      - /mnt/user/backup/openbrain/latest:/backup-latest:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness (PLT-H2/M6): confirms the container's node runtime responds — a
      # dead/hung container fails the exec. The real "workers stopped pushing
      # metrics" detector is the Prometheus PushgatewayStale / WorkersMetricsAbsent
      # rules (a wedged event loop can still pass this probe).
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1500m
    cpus: '3'
    networks:
      - open-brain
      - observability        # workers push metrics to the shared pushgateway:9091 (ADR-0004)
    restart: unless-stopped
    logging: *default_logging

  slack-bot:
    image: ghcr.io/davistroy/open-brain/slack-bot:latest
    build:
      context: .
      target: slack-bot
    container_name: open-brain-slack-bot
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      CORE_API_URL: http://core-api:3000
      # REDIS_URL arrives via env_file: .env.secrets (synthesized by load-secrets.sh,
      # #281/D145) — not interpolated, not re-declared here (would override env_file).
      OPENAI_BASE_URL: https://api.openai.com/v1
      NODE_OPTIONS: "--max-old-space-size=1200"
      # SLACK_BOT_TOKEN: set in .env.secrets   (xoxb-...)
      # SLACK_APP_TOKEN: set in .env.secrets   (xapp-...)
      # OPENAI_API_KEY: set in .env.secrets
    volumes:
      - ./config:/app/config:ro
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      # Liveness (PLT-M6): node runtime responds. slack-bot is Socket Mode (no HTTP
      # endpoint to probe); a dead/hung container fails the exec.
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1500m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # Ollama runs as standalone container — connected via scripts/post-compose-up.sh
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: open-brain-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #   mem_limit: 16g
  #   networks:
  #     - open-brain
  #   restart: unless-stopped

  file-ingestion:
    image: ghcr.io/davistroy/open-brain/file-ingestion:latest
    build:
      context: packages/file-ingestion
      dockerfile: Dockerfile
    container_name: open-brain-file-ingestion
    environment:
      PORT: "8080"
      LOG_LEVEL: "INFO"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${STAGING_DIR:-/mnt/user/openbrain/staging}:/data/staging:ro
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 1536m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # --- Voice services: iOS Shortcut → voice-capture → faster-whisper batch transcription (the LIVE path) ---

  faster-whisper:
    # #301/D153: migrated fedirz/faster-whisper-server -> speaches (its OpenAI-compatible
    # successor: same /v1/audio/transcriptions + /health on :8000). Service NAME kept as
    # `faster-whisper` so WHISPER_URL consumers + container-health probe stay unchanged.
    # speaches loads models per-request (no WHISPER__MODEL) — model=whisper-1 resolves via
    # the model_aliases.json mount; PRELOAD_MODELS warms large-v3 at startup.
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: open-brain-faster-whisper
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      PRELOAD_MODELS: '["Systran/faster-whisper-large-v3"]'
    ports:
      - "127.0.0.1:10300:8000"
    volumes:
      # New named volume at speaches' non-root HF cache path (container runs as `ubuntu`).
      # The old whisper_model_cache (/root/.cache) is intentionally NOT reused -> ~3 GB
      # re-download of large-v3 on first boot; the old volume is retained for rollback.
      - hf_hub_cache:/home/ubuntu/.cache/huggingface/hub
      - ./config/whisper/model_aliases.json:/home/ubuntu/speaches/model_aliases.json:ro
    healthcheck:
      # speaches' own known-good check (its image ships curl); 127.0.0.1 per house rule.
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # first boot downloads ~3 GB large-v3 before /health is ready
    mem_limit: 8g
    cpus: '4'
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  voice-capture:
    image: ghcr.io/davistroy/open-brain/voice-capture:latest
    build:
      context: .
      target: voice-capture
    container_name: open-brain-voice-capture
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      PORT: "3001"
      CORE_API_URL: http://core-api:3000
      WHISPER_URL: http://faster-whisper:8000
      OPENAI_BASE_URL: https://api.openai.com/v1
      NODE_OPTIONS: "--max-old-space-size=1200"
      # OPENAI_API_KEY: set in .env.secrets
      # PUSHOVER_TOKEN: set in .env.secrets
      # PUSHOVER_USER: set in .env.secrets
      # VOICE_CAPTURE_SECRET: set in .env.secrets (INT-M5 Bearer auth on /api/capture;
      #   warn-and-allow if unset — two-phase rollout). Port stays LAN per D132/Option 1
      #   (live iOS Shortcut posts here directly); 8.2 loopback bind deferred to ops backlog.
    ports:
      - "3001:3001"
    volumes:
      # SE-13: brain-views.yaml is read for brain_view validation (lightweight,
      # like slack-bot). Read-only — voice-capture never writes config.
      - ./config:/app/config:ro
      # INT-M4: durable spool for dead-lettered transcripts (survives restart).
      - voice_spool_data:/data/voice-spool
    depends_on:
      core-api:
        condition: service_healthy
      faster-whisper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 1500m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  web-next:
    image: ghcr.io/davistroy/open-brain/web-next:latest
    build:
      context: .
      dockerfile: packages/web-next/Dockerfile
    container_name: open-brain-web-next
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      # TZ: ensures getHours() in RSC server code matches the user's timezone,
      # preventing SSR/CSR hydration mismatches (e.g. greeting, date headers).
      TZ: America/New_York
      # API_URL: server-side base URL for the core-api origin. Used by
      # next.config.ts rewrites AND as the primary fallback in getApiBase()
      # (lib/api/core.ts) for RSC/server code. Browser code never reads an
      # env var for this — it always calls the relative `/api/v1` path,
      # proxied server-side — so NEXT_PUBLIC_API_URL is deliberately not set
      # here (it would be dead config: API_URL always wins in the fallback
      # chain, and it is not passed as a build ARG to the client bundle).
      API_URL: http://core-api:3000
    ports:
      - "3003:3001"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      # SA-7: static/lightweight route — NOT the SSR /dashboard, which fetches
      # from core-api and would fail this healthcheck on a core-api hiccup
      # even though the Next.js process itself is fine. See app/api/healthz/route.ts.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # mem_limit (not deploy.resources, which `docker compose` ignores outside
    # swarm — PLT-L2): matches every other service and actually takes effect.
    mem_limit: 512m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  cloudflared:
    image: cloudflare/cloudflared:2025.6.1
    container_name: open-brain-cloudflared
    # --metrics exposes /ready + /metrics (PLT-H2/M6). No CMD healthcheck: the
    # cloudflared image is distroless (no shell for CMD-SHELL); tunnel liveness is
    # covered by the external synthetic monitor (health.troy-davis.com).
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 --config /etc/cloudflared/tunnel.yaml run
    env_file:
      # #281/D145: cloudflared is DISTROLESS (no shell for sh -c), so the token must
      # arrive as an env var via env_file — not interpolated (which .env.secrets can't
      # feed). load-secrets.sh writes TUNNEL_TOKEN directly (secrets-map.sh maps
      # open-brain-cloudflare-tunnel-token -> TUNNEL_TOKEN); nothing else reads it.
      - .env.secrets
    volumes:
      - ./config/cloudflare/tunnel.yaml:/etc/cloudflared/tunnel.yaml:ro
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # Python batch-ingest sidecar — hosts financial-pipeline.py + utility-pipeline.py.
  # Long-lived container; host cron shells in with `docker exec` to run tasks.
  # Replaces the per-script deployment on open-brain-vm (G-C.0 decision: Python
  # sidecar on homeserver, not TS rewrite).
  financial-ingest:
    image: ghcr.io/davistroy/open-brain/ingest-sidecar:latest
    build:
      context: .
      dockerfile: docker/ingest-sidecar/Dockerfile
    container_name: open-brain-financial-ingest
    env_file:
      - .env.secrets
    environment:
      # BWS_ACCESS_TOKEN set in .env.secrets — required for bws secret list
      # INGEST_TRIGGER_SECRET via .env.secrets — bearer token for core-api's
      # ingest-process dispatch (constant-time compare; NOT HMAC/signed). #300
      INGEST_SOURCE: financial  # binds trigger_server.py to financial-pipeline.py
      FINANCIAL_INBOX_DIR: /inbox
      FINANCIAL_PIPE_DIR: /data
      FINANCIAL_CONFIG_DIR: /app/config/financial
      # Post captures to core-api over the internal Docker network, not via
      # the public brain.troy-davis.com URL. Public URL is fronted by
      # Cloudflare Access which 302s unauthenticated POSTs.
      CAPTURE_API_URL: http://core-api:3000/api/v1/captures
      CAPTURE_API_CALLER: financial-pipeline
      TZ: America/New_York
    volumes:
      # Host inbox — drop CSVs here and they'll be processed on next cron run.
      # Matches backup-path convention under /mnt/user/appdata on Unraid host.
      - /mnt/user/appdata/open-brain/financial-inbox:/inbox
      # SQLite DB + any future sidecar state
      - financial_ingest_data:/data
      # Config (plaid-config.yaml, merchants.yaml) read-only
      - ./config:/app/config:ro
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 1500m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # Utility batch-ingest sidecar — same image as financial-ingest, different
  # config + inbox. Handles utility-pipeline.py (gas, power, water summaries).
  # Build block is duplicated so either service can rebuild the shared image.
  utility-ingest:
    image: ghcr.io/davistroy/open-brain/ingest-sidecar:latest
    build:
      context: .
      dockerfile: docker/ingest-sidecar/Dockerfile
    container_name: open-brain-utility-ingest
    env_file:
      - .env.secrets
    environment:
      # INGEST_TRIGGER_SECRET via .env.secrets — bearer token for core-api's
      # ingest-process dispatch (constant-time compare; NOT HMAC/signed). #300
      INGEST_SOURCE: utility  # binds trigger_server.py to utility-pipeline.py
      UTILITY_INBOX_DIR: /inbox
      UTILITY_PIPE_DIR: /data
      UTILITY_CONFIG_DIR: /app/config/utility
      CAPTURE_API_URL: http://core-api:3000/api/v1/captures
      CAPTURE_API_CALLER: utility-pipeline
      TZ: America/New_York
    volumes:
      - /mnt/user/appdata/open-brain/utility-inbox:/inbox
      - utility_ingest_data:/data
      - ./config:/app/config:ro
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 1500m
    networks:
      - open-brain
    restart: unless-stopped
    logging: *default_logging

  # actual-ingest — Actual Budget daily ingestion (issue #311 / spec 2026-07-15).
  # Its OWN image (NOT the shared ingest-sidecar tag — D140/Entry 201 trap).
  # Dual-homed: br0 (macvlan) to reach the Actual server BY DNS NAME, open-brain
  # (bridge) to POST captures to core-api. Host cron `0 6 * * *` runs one job
  # (6am ET native — the homeserver TZ is America/New_York, so #295 does not apply):
  #   docker exec open-brain-actual-ingest node /app/actual-daily.mjs
  actual-ingest:
    image: ghcr.io/davistroy/open-brain/actual-ingest:latest
    build:
      context: .
      dockerfile: docker/actual-sidecar/Dockerfile
    container_name: open-brain-actual-ingest
    init: true   # reap signals for the idle `sleep infinity` PID 1
    env_file:
      - .env.secrets
    environment:
      # ACTUAL_PASSWORD / ACTUAL_SYNC_ID / ACTUAL_SERVER_URL / PUSHOVER_* arrive
      # via .env.secrets (secrets lockstep: deploy/.env.secrets.template +
      # scripts/lib/secrets-map.sh). The Actual server is reached by DNS NAME, so
      # its address is never written here.
      CORE_API_URL: http://core-api:3000
      ACTUAL_RULES_PATH: /app/config/payee-rules.yaml
      ACTUAL_DATA_DIR: /data/actual
      ACTUAL_STATE_PATH: /data/state.json
      TZ: America/New_York
    volumes:
      - actual_ingest_data:/data
      - ./config:/app/config:ro   # host-only config/payee-rules.yaml, read-only
    networks:
      open-brain: {}
      # STATIC IP (D142) — a LITERAL in tracked compose, deliberately: br0 declares
      # the whole /24 with NO ip-range, so every br0 container is hand-assigned.
      # 192.168.10.13 was verified unclaimed (no ping, ARP INCOMPLETE). The router
      # DHCP pool floor MUST sit above it (OA-21) — "unclaimed today" ≠ "reserved".
      # Mirrors config/ai-routing.yaml's "(STATIC IP, do not change)" convention.
      br0:
        ipv4_address: 192.168.10.13
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    logging: *default_logging
