[tool.ruff]
target-version = "py311"
line-length = 100
src = [
  "scripts",
  "docker/ingest-sidecar",
  "packages/file-ingestion/src",
]
extend-exclude = [
  "packages/file-ingestion/tests",
  "**/node_modules",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# Ops scripts (scripts/) carry looser style than the 3 strongly-typed packages.
# Relax a handful of low-value warnings there.  All scripts are now in pyright
# include (P32) with targeted # type: ignore suppressions for pre-existing issues.
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B007", "E701", "E402", "E741", "SIM102", "SIM105"]

[tool.pyright]
include = [
  "docker/ingest-sidecar",
  "packages/file-ingestion/src",
  "scripts",
]
exclude = ["**/tests", "**/__pycache__"]
pythonVersion = "3.12"
# Production targets are Linux containers; setting platform explicitly ensures
# Unix-only modules (fcntl, etc.) resolve correctly even when pyright is run
# from Windows dev machines.
pythonPlatform = "Linux"
typeCheckingMode = "standard"
reportMissingImports = "warning"
