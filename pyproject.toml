[tool.ruff]
target-version = "py311"
line-length = 100
src = [
  "scripts",
  "docker/ingest-sidecar",
  "packages/voice-pipecat/src",
  "packages/file-ingestion/src",
]
extend-exclude = [
  "packages/voice-pipecat/tests",
  "packages/file-ingestion/tests",
  "**/node_modules",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# Ops scripts (scripts/) are not in pyright include and carry looser style.
# Relax a handful of low-value warnings there while keeping the 3 strongly-typed
# packages (docker/ingest-sidecar, packages/voice-pipecat/src, packages/file-ingestion/src)
# strict. Scripts typecheck/lint-tightening is a separate follow-up (see IMPLEMENTATION_PLAN.md).
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B007", "E701", "E402", "E741", "SIM102", "SIM105"]

[tool.pyright]
include = [
  "docker/ingest-sidecar",
  # "packages/voice-pipecat/src",  # TODO(A68): scoped out pending follow-up —
  #   redis.asyncio stub gaps (session.py) + Anthropic SDK content-block union
  #   narrowing (capture_extractor.py) + optional pipecat imports. Separate PR.
  "packages/file-ingestion/src",
  # P28: pyright coverage for the two largest ops scripts (financial + utility)
  "scripts/financial-pipeline.py",
  "scripts/utility-pipeline.py",
]
exclude = ["scripts", "**/tests", "**/__pycache__"]
pythonVersion = "3.12"
# Production targets are Linux containers; setting platform explicitly ensures
# Unix-only modules (fcntl, etc.) resolve correctly even when pyright is run
# from Windows dev machines.
pythonPlatform = "Linux"
typeCheckingMode = "standard"
reportMissingImports = "warning"
