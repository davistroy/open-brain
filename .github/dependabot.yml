# .github/dependabot.yml — GitHub remediation plan Phase 6, item 6.6
# Enables automated security fixes and grouped Dependabot updates to prevent
# alert recurrence after the 119-alert Phase 6 remediation. Grouped minor/patch
# updates land as single PRs; majors surface individually for isolated review.
# Weekly cadence balances CVE response time against noise on strict CI gates.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(npm)"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /cloudflare/email-worker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      email-worker-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(email-worker)"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /cloudflare/synthetic-monitor
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      synthetic-monitor-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(synthetic-monitor)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # PE-L6: the Python sidecars + ops scripts were previously invisible to
  # Dependabot (npm-only config). pip covers every pyproject.toml / requirements*.txt.
  - package-ecosystem: pip
    directories:
      - /
      - /packages/file-ingestion
      - /docker/ingest-sidecar/tests
      - /scripts
      - /scripts/tests
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(python)"
    labels:
      - dependencies

  # PE-L6: base-image pins in the Dockerfiles (Phase-9.5 pins age silently otherwise).
  # NOTE: /scripts/Dockerfile.repair uses a non-standard name Dependabot's docker
  # ecosystem may not auto-detect; the docker-compose.yml third-party image pins
  # (redis, cloudflared, pgvector, etc.) are NOT covered by Dependabot and need a
  # separate periodic manual review (tracked via the monthly-audit cadence).
  - package-ecosystem: docker
    directories:
      - /
      - /packages/web-next
      - /packages/file-ingestion
      - /docker/ingest-sidecar
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(docker)"
    labels:
      - dependencies
