name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @open-brain/shared build

      - name: Build remaining packages
        run: pnpm --filter !@open-brain/shared -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  sidecar-test:
    name: Sidecar tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docker/ingest-sidecar/tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r docker/ingest-sidecar/tests/requirements.txt

      - name: Run pytest
        run: python3 -m pytest docker/ingest-sidecar/tests/ -v --tb=short

  voice-pipecat-test:
    name: voice-pipecat tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/voice-pipecat/tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
        working-directory: packages/voice-pipecat

      - name: Run pytest
        run: python3 -m pytest tests/ -v --tb=short
        working-directory: packages/voice-pipecat

  file-ingestion-test:
    name: file-ingestion tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/file-ingestion/requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt
        working-directory: packages/file-ingestion

      - name: Run pytest
        run: python3 -m pytest tests/ -v --tb=short
        working-directory: packages/file-ingestion

  validate-schema:
    name: Validate init-schema.sql
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect schema-related changes
        id: diff
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD)
          if echo "$CHANGED" | grep -qE '(scripts/init-schema\.sql|packages/shared/drizzle/|packages/shared/src/schema/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run schema validator
        if: steps.diff.outputs.changed == 'true'
        run: bash scripts/validate-init-schema.sh

  python-lint:
    name: Python lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ruff==0.6.* pyright==1.1.*
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright

  integration-test:
    name: Integration tests (core-api + real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # OBSERVE MODE — promotion checklist:
    # 1. Verify 2 consecutive PRs show this job green in GitHub Actions
    # 2. Remove the `continue-on-error: true` line below
    # 3. Add "Integration tests (core-api + real DB)" to branch protection
    #    required status checks: Settings > Branches > main > Edit >
    #    "Require status checks to pass" > search for job name
    # 4. Update this comment to: "REQUIRED: promoted YYYY-MM-DD PR #NNN"
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @open-brain/shared build

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d --wait --build

      - name: Run integration tests
        run: pnpm --filter @open-brain/core-api exec vitest run --config vitest.config.integration.ts
        env:
          TEST_POSTGRES_URL: postgresql://openbrain_test:test_password@localhost:5433/openbrain_test
          TEST_REDIS_URL: redis://localhost:6381
          NODE_ENV: test

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Tear down test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  doc-sync:
    name: Doc version sync check
    runs-on: ubuntu-latest
    # OBSERVE MODE — promotion checklist (same pattern as integration-test):
    # 1. Verify 2 consecutive PRs show this job green in GitHub Actions
    # 2. Remove the `continue-on-error: true` line below
    # 3. Add "Doc version sync check" to branch protection required status checks
    # 4. Update this comment to: "REQUIRED: promoted YYYY-MM-DD PR #NNN"
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: ''

      - name: Check version strings agree
        run: bash scripts/sync-docs.sh
