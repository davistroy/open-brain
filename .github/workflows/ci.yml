name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Scans the current tree (`gitleaks dir`), NOT full history — history still
      # contains the pre-scrub CS-2 identifiers until the OA-30 filter-repo rewrite,
      # so a history scan would false-fail. This gate catches any NEW secret or
      # utility/PII identifier reintroduced into a committed file.
      - name: Run gitleaks (working tree)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            dir . --no-banner --redact --config .gitleaks.toml --exit-code 1

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore pnpm store cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @open-brain/shared build

      - name: Build remaining packages
        run: pnpm --filter !@open-brain/shared -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Secrets redaction guard
        run: bash scripts/test-backup-secrets-redaction.sh

      - name: Backup harness
        # fake docker + real WAL SQLite; needs python3 (stdlib sqlite3), jq, flock, tar, git —
        # all preinstalled on ubuntu-latest
        run: bash scripts/test-backup.sh

      - name: Secrets round-trip guard
        run: bash scripts/test-secrets-roundtrip.sh

      - name: Pushover encoding guard
        run: bash scripts/test-pushover-encoding.sh

      - name: Deploy parity harness
        run: bash scripts/test-check-deploy-parity.sh

      - name: Deploy script harness
        run: bash scripts/test-deploy.sh

      - name: Restore rehearsal harness
        run: bash scripts/test-restore-rehearsal.sh

      - name: Offsite backup harness
        run: bash scripts/test-offsite-backup.sh

      - name: Install-crons harness
        run: bash scripts/test-install-crons.sh

  email-worker-test:
    name: email-worker tests (Cloudflare Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # QA-7 / SW5-L13: cloudflare/email-worker is a standalone npm project
    # (its own package-lock.json) outside the pnpm workspace — Dependabot bumps
    # it (postal-mime, @cloudflare/workers-types) but nothing ever compiled or
    # tested it. This job closes that gap so those bumps become safe to merge.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # This standalone npm job has no pnpm; setup-node v5 otherwise
          # auto-detects the repo-root pnpm-lock.yaml and fails on `pnpm store
          # path`. Mirrors the doc-sync job. (fixes CI red from PR #244)
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare/email-worker

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: cloudflare/email-worker

      - name: Run tests
        run: npx vitest run
        working-directory: cloudflare/email-worker

  actual-ingest-test:
    name: actual-ingest tests (Actual Budget sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # #311: scripts/actual is a standalone npm project (its own package-lock.json)
    # outside the pnpm workspace, mirroring cloudflare/email-worker. It holds the
    # money-correctness logic — the §5 phantom-income invariant, classify order,
    # per-item fault isolation — so it MUST be tested in CI.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Standalone npm job, no pnpm — see email-worker-test note.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: scripts/actual

      - name: Run tests
        run: npx vitest run
        working-directory: scripts/actual

  sidecar-test:
    name: Sidecar tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docker/ingest-sidecar/tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r docker/ingest-sidecar/tests/requirements.txt

      - name: Run pytest
        run: python3 -m pytest docker/ingest-sidecar/tests/ -v --tb=short

  file-ingestion-test:
    name: file-ingestion tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/file-ingestion/requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt
        working-directory: packages/file-ingestion

      - name: Run pytest
        run: python3 -m pytest tests/ -v --tb=short
        working-directory: packages/file-ingestion

  validate-schema:
    name: Validate init-schema.sql
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run schema validator
        # Unconditional (QA-L11, 2026-06-15). Phase 5 (DA-H1) made this a two-DB
        # parity diff: it builds (init-schema only) vs (init-schema + every drizzle
        # 0*.sql), pg_dumps both, and fails if they differ — i.e. if a migration was
        # added without back-porting it into the generated scripts/init-schema.sql.
        # Fix on failure: `bash scripts/regenerate-init-schema.sh` and commit the result.
        run: bash scripts/validate-init-schema.sh

      - name: Test migrate-manual.sh (atomic migrations)
        # Item 6.1: each migration + its ledger row run in one transaction; a failed
        # file leaves no objects and no ledger row. Throwaway pgvector container.
        run: bash scripts/test-migrate-manual.sh

  dr-restore-e2e:
    name: DR backup + restore (real, 64 MB /dev/shm)
    # Item 7.2: the real scripts/backup.sh on a seeded database, then the real
    # scripts/restore-rehearsal.sh on its output, in containers with the production
    # postgresql.conf and Docker's default 64 MB /dev/shm. Fails if restore_into loses
    # PGOPTIONS='-c max_parallel_maintenance_workers=0' (the HNSW index would not restore).
    # Runs on every push/PR (no path filter), so a change to backup.sh,
    # restore-rehearsal.sh or lib/restore-core.sh always runs it.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Real backup and restore
        run: bash scripts/test-restore-e2e.sh

  validate-alert-rules:
    name: Validate Prometheus alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PE-M8/QA-10: scripts/validate-alert-rules.sh existed but was wired into no
    # workflow — a malformed rule file (config/prometheus/alerts/*.yml) produced
    # zero CI signal, only discoverable via a failed shared-Prometheus reload
    # post-deploy. Cheap + no external deps (falls back to python3 yaml.safe_load
    # when promtool isn't on PATH, which is the case on ubuntu-latest).

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run alert rules validator
        run: bash scripts/validate-alert-rules.sh

  validate-compose-dr:
    name: Validate prod compose (DR — no secret interpolation)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # #281/D145: proves a rebuilt host boots from load-secrets.sh alone. The PROD
    # docker-compose.yml must not interpolate any SECRET from `.env`/shell — every
    # secret arrives via `env_file: .env.secrets`. With an EMPTY `.env` and only a
    # placeholder `.env.secrets`, `docker compose config` must emit ZERO "Defaulting
    # to a blank string" warnings (each one is a secret that would be silently blank
    # after a DR rebuild). No CI job validated the prod compose before — only the
    # test compose. This reproduces #281 with no host and no BWS token.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render prod compose with no secrets present
        env:
          TAILSCALE_IP: 100.64.0.1   # required (item 4.4) — an address, not a secret
        run: |
          : > .env          # empty — nothing to interpolate from (the DR condition)
          : > .env.secrets  # placeholder so `env_file:` resolves
          out="$(docker compose -f docker-compose.yml config 2>&1 >/dev/null)" || {
            echo "FAIL: docker compose config errored on the prod compose:"; echo "$out"; exit 1;
          }
          warnings="$(printf '%s\n' "$out" | grep -i 'defaulting to a blank string' || true)"
          if [ -n "$warnings" ]; then
            echo "FAIL: prod docker-compose.yml interpolates secrets from .env/shell (DR-unsafe, #281/D145):"
            printf '%s\n' "$warnings"
            echo "Move each to env_file: .env.secrets (see load-secrets.sh)."
            exit 1
          fi
          echo "OK: prod compose renders + zero blank-string interpolation — no SECRET is read from .env. A rebuilt host still needs .env with TAILSCALE_IP (an address, not a secret) before any compose command."

      - name: Postgres and Redis data render as fail-closed binds (no override)
        # Item 4.3 (PLT-001/DA7-05/SA7-04): the data-directory pin lives in the BASE
        # compose, not only in the host's gitignored override (ADR-0004 landmine). Fails
        # when either data mount becomes a named volume or short syntax (create_host_path
        # back on), leaves the live host path, or when the tracked override template
        # drifts. Renders with no override file present; never prints a render.
        env:
          TAILSCALE_IP: 100.64.0.1
        run: |
          test ! -e docker-compose.override.yml
          bash scripts/test-compose-data-binds.sh

      - name: Host bindings fail closed (binds + required TAILSCALE_IP)
        # Item 4.4 (SA7-17/PLT-014): every bind has create_host_path false (a missing host
        # path refuses to start instead of mounting an empty directory), and an empty
        # TAILSCALE_IP fails the render naming the variable. Renders are never printed.
        env:
          TAILSCALE_IP: 100.64.0.1
        run: |
          : > .env.secrets
          docker compose -f docker-compose.yml config --format json \
            | jq -e 'all(.services[].volumes[]?; .type != "bind" or .bind.create_host_path == false)' >/dev/null \
            || { echo "FAIL: a bind mount still creates a missing host path"; exit 1; }
          if TAILSCALE_IP= docker compose -f docker-compose.yml config -q 2>err.txt; then
            echo "FAIL: render succeeded with an empty TAILSCALE_IP"; exit 1
          fi
          grep -q TAILSCALE_IP err.txt || { echo "FAIL: the error does not name TAILSCALE_IP"; cat err.txt; exit 1; }
          bash scripts/test-compose-host-binds.sh
          bash scripts/test-compose-identity.sh

      - name: core-api inbox binds match the sidecar inboxes
        # Item 9.4: an upload must land where a sidecar's --process-inbox reads.
        # Each core-api inbox bind source must equal the /inbox bind source of the
        # matching sidecar. Render is never printed.
        env:
          TAILSCALE_IP: 100.64.0.1
        run: |
          : > .env.secrets
          docker compose -f docker-compose.yml config --format json | jq -e '
            def src(svc; tgt): [.services[svc].volumes[]? | select(.type == "bind" and .target == tgt) | .source];
            (src("core-api"; "/app/inbox-volumes/financial")) as $cf
            | (src("financial-ingest"; "/inbox")) as $sf
            | (src("core-api"; "/app/inbox-volumes/utility")) as $cu
            | (src("utility-ingest"; "/inbox")) as $su
            | ($cf | length) == 1 and $cf == $sf and ($cu | length) == 1 and $cu == $su
          ' >/dev/null || { echo "FAIL: core-api inbox binds do not match the sidecar /inbox binds"; exit 1; }

  python-lint:
    name: Python lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ruff==0.6.* pyright==1.1.*
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright

  integration-test:
    name: Integration tests (core-api + real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED: promoted 2026-05-05 — A118 cascade resolved; integration suite 126/126 green.
    # Bar relaxed from >=9/10 runs to "1 green CI on b08946a + local 126/126 + root-cause documented"
    # (orchestrator-authorized 2026-05-05). Run 25406460328 was the qualifying green on this branch.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore pnpm store cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @open-brain/shared build

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d --wait --build

      - name: Run integration tests
        run: pnpm --filter @open-brain/core-api exec vitest run --config vitest.config.integration.ts
        env:
          TEST_POSTGRES_URL: postgresql://openbrain_test:test_password@localhost:5433/openbrain_test
          TEST_REDIS_URL: redis://localhost:6381
          NODE_ENV: test

      - name: Run workers integration tests
        run: pnpm --filter @open-brain/workers exec vitest run --config vitest.config.integration.ts
        env:
          TEST_POSTGRES_URL: postgresql://openbrain_test:test_password@localhost:5433/openbrain_test
          TEST_REDIS_URL: redis://localhost:6381
          # QA-M3 (INGEST_E2E) is intentionally NOT enabled in THIS required job:
          # the e2e needs a full stack (core-api + workers + sidecar), and this
          # required gate stays lean. INGEST_E2E now runs in the dedicated
          # `full-stack-e2e` job below (item 8.1) which activates the compose
          # `fullstack` profile (test-core-api + test-workers). That job is NOT a
          # required check while the happy-path fixture proves out (see its notes).
          NODE_ENV: test

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Tear down test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  doc-sync:
    name: Doc version sync check
    runs-on: ubuntu-latest
    # BLOCKING as of 2026-07-12 (item 7.3) — sync-docs.sh has been green across
    # the observe-mode window; `continue-on-error` removed.
    #
    # Scope note (PE-M7): this check is version-STRING-only — it diffs version
    # numbers embedded across docs/config, nothing more. It cannot catch
    # procedure or prose drift (the PLT-C1 class: a runbook step that's
    # syntactically fine but describes a stale/wrong procedure). Do not treat a
    # green run here as validation of runbook or doc CONTENT correctness — it
    # only proves version strings agree.
    #
    # Adding to branch-protection required status checks is a separate
    # operator `gh api` step (OA-8), not part of this workflow file.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check version strings agree
        run: bash scripts/sync-docs.sh

  full-stack-e2e:
    name: Full-stack e2e (ingest + web smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Heavy (builds core-api + workers images): run on PRs and main pushes only,
    # not every feature-branch push. Keeps CI minutes sane for a non-required job.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # NOT a required status check (item 8.1). Stands up REAL core-api + workers
    # (compose `fullstack` profile) against the ephemeral test DB/Redis and runs
    # the gated INGEST_E2E suite + the Playwright web smoke.
    #
    # The ingest e2e and web smoke steps FAIL the job: a broken upload path or a
    # smoke failure must surface red here (item 9.4). Required-check promotion
    # follows three consecutive green runs on main (owner task).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore pnpm store cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @open-brain/shared build

      - name: Start test Postgres + Redis
        run: docker compose -f docker-compose.test.yml up -d --wait test-postgres test-redis

      - name: Apply schema to test Postgres (ledger model — no auto-migrate)
        run: |
          docker compose -f docker-compose.test.yml exec -T test-postgres \
            psql -U openbrain_test -d openbrain_test -v ON_ERROR_STOP=1 \
            < scripts/init-schema.sql

      - name: Build + start full stack (core-api + workers + sidecar)
        run: docker compose -f docker-compose.test.yml --profile fullstack up -d --wait --build

      - name: Make the shared inbox volume writable by the non-root core-api
        # core-api runs as uid 1000 (`USER node`) and writes uploads into
        # /inbox-root/financial; the fresh named volume is root-owned. No file is
        # pre-seeded: the e2e asserts that the UPLOADED `<uuid>-activity.csv`
        # itself produces the capture (item 9.4 review — a bare seed masked a
        # sidecar routing miss on the UUID prefix).
        run: |
          docker compose -f docker-compose.test.yml exec -T test-sidecar \
            sh -c 'mkdir -p /inbox-root/financial && chown -R 1000:1000 /inbox-root'

      - name: Run ingest e2e (INGEST_E2E=1) against real core-api + workers
        env:
          INGEST_E2E: '1'
          CORE_API_URL: http://localhost:3002
          INGEST_SOURCE: financial
          INGEST_TRIGGER_SECRET: test-secret-do-not-use-in-prod
          NODE_ENV: test
        run: >-
          pnpm --filter @open-brain/workers exec vitest run
          --config vitest.config.integration.ts
          src/__tests__/integration/ingest-e2e.test.ts

      - name: Install Playwright chromium
        run: pnpm --filter @open-brain/web-next exec playwright install --with-deps chromium

      - name: Run web smoke (Playwright; fails if the stack is unreachable)
        env:
          # Next dev server rewrites /api -> API_URL; point it at the published
          # test core-api. The smoke fails under CI=true if it's unreachable.
          API_URL: http://localhost:3002
          CI: 'true'
        run: pnpm --filter @open-brain/web-next test:e2e

      - name: Dump full-stack logs on failure
        if: always()
        run: docker compose -f docker-compose.test.yml --profile fullstack logs --no-color

      - name: Tear down full stack
        if: always()
        run: docker compose -f docker-compose.test.yml --profile fullstack down -v
