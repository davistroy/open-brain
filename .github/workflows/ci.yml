name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @open-brain/shared build

      - name: Build remaining packages
        run: pnpm --filter !@open-brain/shared -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  sidecar-test:
    name: Sidecar tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docker/ingest-sidecar/tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r docker/ingest-sidecar/tests/requirements.txt

      - name: Run pytest
        run: python3 -m pytest docker/ingest-sidecar/tests/ -v --tb=short
