<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Open Brain — Empty states</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css?v=a5" />
<style>
  body { background: var(--color-bg-layout-main); min-height: 100vh; }
  *:focus-visible { outline: 2px solid var(--color-book-cloth); outline-offset: 2px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../ui_kits/dashboard/Button.jsx"></script>
<script type="text/babel" src="../ui_kits/dashboard/Badge.jsx"></script>
<script type="text/babel" src="../ui_kits/dashboard/Container.jsx"></script>
<script type="text/babel" src="../ui_kits/dashboard/TopNav.jsx"></script>
<script type="text/babel" src="../ui_kits/dashboard/SideNav.jsx"></script>
<script type="text/babel" src="./_shell.jsx"></script>
<script type="text/babel">
// Empty state showcase — five flavors, each in a framed "device" card so we see
// them as a system rather than as individual screens.

const EmptyFrame = ({ label, screen, children, height = 360 }) => (
  <div style={{ background: 'var(--color-bg-container)', border: '1px solid var(--color-cloud-light)' }}>
    {/* Frame header — mimics a browser tab */}
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px',
      borderBottom: '1px solid var(--color-cloud-light)', background: 'var(--color-ivory-dark)',
    }}>
      <div style={{ display: 'flex', gap: 4 }}>
        <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--color-cloud-medium)' }}></div>
        <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--color-cloud-medium)' }}></div>
        <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--color-cloud-medium)' }}></div>
      </div>
      <div style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 10.5, color: 'var(--color-text-body-secondary)', letterSpacing: '0.06em' }}>
        {screen}
      </div>
      <div style={{ marginLeft: 'auto', fontFamily: 'var(--font-family-monospace)', fontSize: 10, color: 'var(--color-cloud-dark)', letterSpacing: '0.05em' }}>
        {label}
      </div>
    </div>
    <div style={{ height, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 24px' }}>
      {children}
    </div>
  </div>
);

// 1. First-time dashboard — nothing ingested yet
const EmptyDashboard = () => (
  <div style={{ textAlign: 'center', maxWidth: 380 }}>
    {/* Illustrative mark: a light book cloth square with a faint "brain" folio fold */}
    <div style={{ width: 64, height: 64, background: 'var(--color-book-cloth-50)', margin: '0 auto 20px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <i data-lucide="inbox" style={{ width: 22, height: 22, strokeWidth: 1.3, color: 'var(--color-book-cloth-dark)' }}></i>
    </div>
    <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 26, letterSpacing: '-0.015em', color: 'var(--color-text-heading)', marginBottom: 10 }}>
      Your brain is empty.
    </div>
    <div style={{ fontSize: 13.5, color: 'var(--color-text-body-secondary)', fontWeight: 300, lineHeight: 1.65, marginBottom: 20 }}>
      Connect a source or capture a thought. Open Brain indexes, weighs it against everything else you know, and starts drafting your first brief within the hour.
    </div>
    <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
      <SBtn variant="primary">Connect a source</SBtn>
      <SBtn variant="secondary">Capture a thought</SBtn>
    </div>
    <div style={{ marginTop: 18, fontFamily: 'var(--font-family-monospace)', fontSize: 10.5, color: 'var(--color-cloud-dark)', letterSpacing: '0.05em' }}>
      OR FORWARD ANY EMAIL TO <span style={{ color: 'var(--color-book-cloth-dark)' }}>INGEST@TROY.OPENBRAIN.IO</span>
    </div>
  </div>
);

// 2. Search — no results
const EmptySearch = () => (
  <div style={{ textAlign: 'center', maxWidth: 400 }}>
    <div style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 11, color: 'var(--color-cloud-dark)', letterSpacing: '0.08em', marginBottom: 12 }}>
      NO MATCHES · 0 OF 6,842
    </div>
    <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 22, letterSpacing: '-0.01em', color: 'var(--color-text-heading)', marginBottom: 14, fontStyle: 'italic', fontWeight: 300 }}>
      "quarterly mushroom strategy"
    </div>
    <div style={{ fontSize: 13, color: 'var(--color-text-body-secondary)', fontWeight: 300, lineHeight: 1.65, marginBottom: 18 }}>
      Nothing matched — but these are close in meaning:
    </div>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, alignItems: 'stretch' }}>
      {['Q3 foraging dossier · Maya K.', 'Notes from Mendocino trip · Oct 12', 'Decision: skip the truffle vendor'].map(x => (
        <div key={x} style={{
          textAlign: 'left', padding: '10px 14px', background: 'var(--color-ivory-dark)',
          border: '1px solid var(--color-cloud-light)', fontSize: 13, color: 'var(--color-text-body)', cursor: 'pointer',
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <i data-lucide="arrow-right" style={{ width: 12, height: 12, strokeWidth: 1.4, color: 'var(--color-book-cloth)' }}></i>
          {x}
        </div>
      ))}
    </div>
  </div>
);

// 3. Timeline on a quiet day
const EmptyTimeline = () => (
  <div style={{ textAlign: 'center', maxWidth: 380 }}>
    {/* Calendar-style glyph */}
    <div style={{
      width: 56, height: 56, border: '1px solid var(--color-cloud-medium)', background: 'var(--color-ivory-dark)',
      margin: '0 auto 18px', display: 'flex', flexDirection: 'column',
    }}>
      <div style={{ height: 14, background: 'var(--color-book-cloth)' }}></div>
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-family-display)', fontSize: 18, color: 'var(--color-text-heading)', fontWeight: 300 }}>—</div>
    </div>
    <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 22, letterSpacing: '-0.01em', color: 'var(--color-text-heading)', marginBottom: 8 }}>
      A quiet Tuesday.
    </div>
    <div style={{ fontSize: 13, color: 'var(--color-text-body-secondary)', fontWeight: 300, lineHeight: 1.65, marginBottom: 16 }}>
      Nothing captured today. Your last thought was <span style={{ color: 'var(--color-book-cloth-dark)' }}>yesterday at 22:14</span> — a voice note about the espresso machine.
    </div>
    <SBtn variant="secondary" size="small" icon={<i data-lucide="plus" style={{ width: 11, height: 11, strokeWidth: 2 }}></i>}>Capture a thought</SBtn>
  </div>
);

// 4. Error state — source disconnected
const EmptyError = () => (
  <div style={{ textAlign: 'center', maxWidth: 420 }}>
    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '4px 10px', background: 'var(--color-faded-red-50)', marginBottom: 18 }}>
      <span style={{ width: 6, height: 6, background: 'var(--color-faded-red)' }}></span>
      <span style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 10.5, color: 'var(--color-red-900)', letterSpacing: '0.08em' }}>FEEDLY · AUTH EXPIRED</span>
    </div>
    <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 22, letterSpacing: '-0.01em', color: 'var(--color-text-heading)', marginBottom: 10 }}>
      We lost the thread.
    </div>
    <div style={{ fontSize: 13, color: 'var(--color-text-body-secondary)', fontWeight: 300, lineHeight: 1.65, marginBottom: 18 }}>
      Feedly's OAuth token expired on April 19. We stopped pulling bookmarks to avoid a silent gap. Reconnect and we'll backfill.
    </div>
    <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
      <SBtn variant="primary" size="small">Reconnect Feedly</SBtn>
      <SBtn variant="ghost" size="small">Dismiss source</SBtn>
    </div>
  </div>
);

// 5. Board with no decisions in flight
const EmptyBoard = () => (
  <div style={{ textAlign: 'center', maxWidth: 380 }}>
    <div style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 11, color: 'var(--color-cloud-dark)', letterSpacing: '0.08em', marginBottom: 14 }}>
      THE BOARD · 0 OPEN MATTERS
    </div>
    <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 22, letterSpacing: '-0.01em', color: 'var(--color-text-heading)', marginBottom: 10 }}>
      Nothing is waiting on you.
    </div>
    <div style={{ fontSize: 13, color: 'var(--color-text-body-secondary)', fontWeight: 300, lineHeight: 1.65, marginBottom: 16, fontStyle: 'italic' }}>
      Every decision in your brain has either been made or is still ripening. This is rare. Enjoy it.
    </div>
    <div style={{ fontSize: 12, color: 'var(--color-cloud-dark)', fontWeight: 300 }}>
      Last cleared: 2 hours ago · 4 decisions resolved this week
    </div>
  </div>
);

// 6. Entity detail — first time viewing
const EmptyEntity = () => (
  <div style={{ textAlign: 'center', maxWidth: 380 }}>
    <div style={{
      width: 48, height: 48, borderRadius: '50%', background: 'var(--color-cloud-light)',
      margin: '0 auto 16px', display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'var(--font-family-display)', fontSize: 20, color: 'var(--color-cloud-dark)',
    }}>?</div>
    <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 20, letterSpacing: '-0.01em', color: 'var(--color-text-heading)', marginBottom: 8 }}>
      We haven't seen them yet.
    </div>
    <div style={{ fontSize: 13, color: 'var(--color-text-body-secondary)', fontWeight: 300, lineHeight: 1.65, marginBottom: 16 }}>
      Add a fact, a first impression, or a meeting — Open Brain will start a dossier and keep adding to it every time this person appears.
    </div>
    <SBtn variant="secondary" size="small" icon={<i data-lucide="plus" style={{ width: 11, height: 11, strokeWidth: 2 }}></i>}>Add first note</SBtn>
  </div>
);

const App = () => (
  <Shell
    active="briefs"
    breadcrumb={['Open Brain', 'Design system', 'Empty states']}
    title="Empty states"
    subtitle="The edges of the product. Treat absence as a feature — a quiet page is a chance to say something true about the system."
  >
    {/* Principles strip */}
    <div style={{
      background: 'var(--color-slate-dark)', color: 'var(--color-ivory-light)',
      padding: '22px 28px', marginBottom: 32,
      display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24,
    }}>
      {[
        { num: '01', title: 'Name the silence', body: 'Don\u2019t fake-fill with skeletons or lorem. Say what\u2019s missing and why.' },
        { num: '02', title: 'Offer one next move', body: 'Every empty state earns its keep with a single, obvious primary action.' },
        { num: '03', title: 'Keep the voice', body: 'Confident, dry, literate. The system is thinking even when you aren\u2019t looking.' },
      ].map(p => (
        <div key={p.num}>
          <div style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 10.5, color: 'var(--color-book-cloth)', letterSpacing: '0.08em', marginBottom: 6 }}>PRINCIPLE / {p.num}</div>
          <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 18, letterSpacing: '-0.01em', fontWeight: 400, marginBottom: 6 }}>{p.title}</div>
          <div style={{ fontSize: 12.5, color: 'rgba(241,234,224,0.7)', fontWeight: 300, lineHeight: 1.55 }}>{p.body}</div>
        </div>
      ))}
    </div>

    {/* 2-column grid of states */}
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
      <EmptyFrame label="FIRST RUN" screen="/dashboard" height={400}><EmptyDashboard /></EmptyFrame>
      <EmptyFrame label="NO RESULTS" screen="/search" height={400}><EmptySearch /></EmptyFrame>
      <EmptyFrame label="QUIET DAY" screen="/timeline" height={340}><EmptyTimeline /></EmptyFrame>
      <EmptyFrame label="BROKEN" screen="/settings/sources/feedly" height={340}><EmptyError /></EmptyFrame>
      <EmptyFrame label="ALL CLEAR" screen="/board" height={320}><EmptyBoard /></EmptyFrame>
      <EmptyFrame label="UNKNOWN" screen="/entities/:new" height={320}><EmptyEntity /></EmptyFrame>
    </div>
  </Shell>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
