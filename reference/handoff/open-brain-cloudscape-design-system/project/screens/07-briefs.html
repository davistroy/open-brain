<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Open Brain — Briefs</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css?v=a5" />
<style>
  body { background: var(--color-bg-layout-main); min-height: 100vh; }
  *:focus-visible { outline: 2px solid var(--color-book-cloth); outline-offset: 2px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../ui_kits/dashboard/Button.jsx"></script>
<script type="text/babel" src="../ui_kits/dashboard/Badge.jsx"></script>
<script type="text/babel" src="../ui_kits/dashboard/Container.jsx"></script>
<script type="text/babel" src="../ui_kits/dashboard/TopNav.jsx"></script>
<script type="text/babel" src="../ui_kits/dashboard/SideNav.jsx"></script>
<script type="text/babel" src="./_shell.jsx"></script>
<script type="text/babel">
const BRIEFS = [
  { id: 'b1', kind: 'DAILY',    title: 'Tuesday morning',          subtitle: '6 items · 3 decisions pending', generated: '07:00', read: false, cover: 'morning' },
  { id: 'b2', kind: 'WEEKLY',   title: 'Week of Apr 14',           subtitle: '34 captures · 8 commitments', generated: 'Sun 18:00', read: true, cover: 'week' },
  { id: 'b3', kind: 'DOSSIER',  title: 'Sarah Chen — pre-1:1',     subtitle: 'Before Thu 14:00', generated: '2h ago', read: false, cover: 'person' },
  { id: 'b4', kind: 'DECISION', title: 'Espresso machine',         subtitle: 'Pros, cons, 4 candidates', generated: 'Yesterday', read: false, cover: 'decision' },
  { id: 'b5', kind: 'PROJECT',  title: 'Q4 planning — state-of',   subtitle: '22 captures · 11 entities', generated: '3d ago', read: true, cover: 'project' },
  { id: 'b6', kind: 'DAILY',    title: 'Monday morning',           subtitle: '4 items · 1 decision pending', generated: 'Mon 07:00', read: true, cover: 'morning' },
];
const COVER = {
  morning:  { bg: 'var(--color-book-cloth-50)', fg: 'var(--color-book-cloth-dark)', mark: '◐' },
  week:     { bg: 'var(--color-slate-medium)',  fg: 'var(--color-ivory-light)',      mark: '▤' },
  person:   { bg: 'var(--color-clay)',          fg: 'var(--color-ivory-light)',      mark: '◉' },
  decision: { bg: 'var(--color-book-cloth)',    fg: 'var(--color-ivory-light)',      mark: '?' },
  project:  { bg: 'var(--color-moss)',          fg: 'var(--color-ivory-light)',      mark: '▦' },
};
const KIND_META = {
  DAILY:    { icon: 'sunrise',  dotTone: 'var(--color-book-cloth)' },
  WEEKLY:   { icon: 'calendar', dotTone: 'var(--color-slate-medium)' },
  DOSSIER:  { icon: 'user-round', dotTone: 'var(--color-book-cloth-dark)' },
  DECISION: { icon: 'gavel',    dotTone: '#5E8F4A' },
  PROJECT:  { icon: 'folder-kanban', dotTone: 'var(--color-cloud-dark)' },
};
const App = () => {
  const [view, setView] = React.useState('grid');
  return (
  <Shell
    active="briefs"
    breadcrumb={['Open Brain', 'Briefs']}
    title="Briefs"
    subtitle="AI-generated summaries — daily, weekly, and on-demand dossiers"
    actions={<>
      <SBtn variant="normal" icon={<i data-lucide="clock" style={{ width: 12, height: 12, strokeWidth: 1.5 }}></i>}>Schedule</SBtn>
      <SBtn variant="primary" icon={<i data-lucide="plus" style={{ width: 12, height: 12, strokeWidth: 2 }}></i>}>New brief</SBtn>
    </>}
  >
    {/* Big hero: today's daily — warm paper */}
    <div style={{
      background: 'var(--color-book-cloth-50)',
      color: 'var(--color-text-heading)',
      padding: '32px 40px',
      marginBottom: 24,
      border: '1px solid #EFD9CD',
      borderLeft: '3px solid var(--color-book-cloth)',
      display: 'grid', gridTemplateColumns: '1fr 260px', gap: 48,
    }}>
      <div>
        <div style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 10.5, color: 'var(--color-book-cloth-dark)', letterSpacing: '0.12em', marginBottom: 10 }}>DAILY · TUESDAY, APRIL 21 · 07:00</div>
        <h2 style={{ fontFamily: 'var(--font-family-display)', fontSize: 34, fontWeight: 300, letterSpacing: '-0.025em', lineHeight: 1.1, margin: '0 0 12px', color: 'var(--color-text-heading)' }}>
          Three decisions are waiting on you today
        </h2>
        <p style={{ fontSize: 14.5, fontWeight: 300, lineHeight: 1.6, color: 'var(--color-text-body)', maxWidth: 620, margin: 0 }}>
          The London office budget memo needs a response (2 days overdue). Sarah has pushed back on the Q4 eng hiring timeline twice — worth a 15-minute call before Thursday's board. Maya asked about customer exposure last Friday; you haven't replied.
        </p>
        <div style={{ display: 'flex', gap: 8, marginTop: 18 }}>
          <SBtn variant="primary" icon={<i data-lucide="arrow-right" style={{ width: 12, height: 12, strokeWidth: 2 }}></i>}>Read full brief</SBtn>
          <SBtn variant="normal" icon={<i data-lucide="play" style={{ width: 12, height: 12, strokeWidth: 1.5 }}></i>}>Listen · 4 min</SBtn>
          <SBtn variant="ghost">Dismiss</SBtn>
        </div>
      </div>
      <div>
        <div style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 10.5, color: 'var(--color-book-cloth-dark)', letterSpacing: '0.12em', marginBottom: 10 }}>IN THIS BRIEF</div>
        {['3 decisions pending', '1 overdue commitment', '4 meetings this week', '2 new entities', '7 low-signal items skipped'].map(l => (
          <div key={l} style={{ display: 'flex', gap: 10, padding: '5px 0', fontSize: 13, fontWeight: 300, color: 'var(--color-text-body)' }}>
            <span style={{ color: 'var(--color-book-cloth)' }}>→</span>{l}
          </div>
        ))}
      </div>
    </div>

    {/* Brief library */}
    <div style={{ display: 'flex', alignItems: 'center', marginBottom: 14, gap: 12 }}>
      <Eyebrow>LIBRARY</Eyebrow>
      <div style={{ flex: 1 }}></div>
      <div style={{ display: 'flex', border: '1px solid var(--color-cloud-medium)' }}>
        {['All', 'Daily', 'Weekly', 'Dossiers', 'Decisions', 'Projects'].map((t, i) => (
          <button key={t} style={{
            padding: '4px 12px', fontSize: 12, background: i === 0 ? 'var(--color-ivory-dark)' : 'transparent',
            color: 'var(--color-text-body)', border: 'none',
            borderRight: i !== 5 ? '1px solid var(--color-cloud-medium)' : 'none',
            fontWeight: i === 0 ? 400 : 300, cursor: 'pointer', fontFamily: 'inherit',
          }}>{t}</button>
        ))}
      </div>
      <div style={{ display: 'flex', border: '1px solid var(--color-cloud-medium)' }}>
        <button onClick={() => setView('grid')} aria-label="Grid view" style={{
          padding: '4px 10px', background: view === 'grid' ? 'var(--color-ivory-dark)' : 'transparent',
          border: 'none', borderRight: '1px solid var(--color-cloud-medium)', cursor: 'pointer',
          display: 'inline-flex', alignItems: 'center',
        }}>
          <i data-lucide="layout-grid" style={{ width: 13, height: 13, strokeWidth: 1.5, color: 'var(--color-text-body)' }}></i>
        </button>
        <button onClick={() => setView('list')} aria-label="List view" style={{
          padding: '4px 10px', background: view === 'list' ? 'var(--color-ivory-dark)' : 'transparent',
          border: 'none', cursor: 'pointer',
          display: 'inline-flex', alignItems: 'center',
        }}>
          <i data-lucide="list" style={{ width: 13, height: 13, strokeWidth: 1.5, color: 'var(--color-text-body)' }}></i>
        </button>
      </div>
    </div>

    {view === 'grid' ? (
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }}>
        {BRIEFS.map(b => {
          const c = COVER[b.cover];
          const km = KIND_META[b.kind];
          return (
            <div key={b.id} style={{
              background: 'var(--color-bg-container)',
              border: '1px solid var(--color-cloud-light)',
              cursor: 'pointer', display: 'grid', gridTemplateColumns: '64px 1fr',
            }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--color-cloud-dark)'; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--color-cloud-light)'; }}>
              {/* Thin left color rail with glyph */}
              <div style={{ background: c.bg, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'space-between', padding: '12px 0 10px', position: 'relative' }}>
                <i data-lucide={km.icon} style={{ width: 15, height: 15, strokeWidth: 1.3, color: c.fg }}></i>
                <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 36, fontWeight: 300, color: c.fg, opacity: 0.35, lineHeight: 1 }}>{c.mark}</div>
              </div>
              <div style={{ padding: '12px 16px 14px', position: 'relative', minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8, marginBottom: 6 }}>
                  <span style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 10, color: 'var(--color-book-cloth-dark)', letterSpacing: '0.12em' }}>{b.kind}</span>
                  {!b.read && <span style={{ width: 6, height: 6, background: 'var(--color-book-cloth)', display: 'inline-block' }}></span>}
                </div>
                <div style={{ fontFamily: 'var(--font-family-display)', fontSize: 17, fontWeight: 400, letterSpacing: '-0.01em', color: 'var(--color-text-heading)', marginBottom: 4, lineHeight: 1.25 }}>{b.title}</div>
                <div style={{ fontSize: 12.5, color: 'var(--color-text-body-secondary)', fontWeight: 300, lineHeight: 1.5 }}>{b.subtitle}</div>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 10, paddingTop: 8, borderTop: '1px solid var(--color-cloud-light)' }}>
                  <span style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 10.5, color: 'var(--color-text-body-secondary)', letterSpacing: '0.03em' }}>{b.generated.toUpperCase()}</span>
                  <i data-lucide="arrow-right" style={{ width: 13, height: 13, strokeWidth: 1.5, color: 'var(--color-cloud-dark)' }}></i>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    ) : (
      <SCard padded={false}>
        <div style={{ display: 'grid', gridTemplateColumns: '90px 1fr 220px 140px 30px', padding: '10px 18px', fontFamily: 'var(--font-family-monospace)', fontSize: 10, letterSpacing: '0.08em', color: 'var(--color-text-body-secondary)', borderBottom: '1px solid var(--color-cloud-medium)', gap: 16 }}>
          <span>KIND</span><span>TITLE</span><span>SUMMARY</span><span>GENERATED</span><span></span>
        </div>
        {BRIEFS.map((b, i) => {
          const km = KIND_META[b.kind];
          return (
            <div key={b.id} style={{
              display: 'grid', gridTemplateColumns: '90px 1fr 220px 140px 30px',
              padding: '12px 18px', alignItems: 'center', gap: 16,
              borderBottom: i === BRIEFS.length - 1 ? 'none' : '1px solid var(--color-cloud-light)',
              cursor: 'pointer', position: 'relative',
            }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--color-ivory-dark)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              {!b.read && <span style={{ position: 'absolute', left: 6, top: '50%', width: 4, height: 4, background: 'var(--color-book-cloth)', transform: 'translateY(-50%)' }}></span>}
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <i data-lucide={km.icon} style={{ width: 12, height: 12, strokeWidth: 1.4, color: km.dotTone }}></i>
                <span style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 10, color: 'var(--color-book-cloth-dark)', letterSpacing: '0.08em' }}>{b.kind}</span>
              </div>
              <div style={{ fontSize: 13.5, fontWeight: b.read ? 300 : 400, color: 'var(--color-text-heading)' }}>{b.title}</div>
              <div style={{ fontSize: 12.5, color: 'var(--color-text-body-secondary)', fontWeight: 300 }}>{b.subtitle}</div>
              <div style={{ fontFamily: 'var(--font-family-monospace)', fontSize: 11, color: 'var(--color-text-body-secondary)', letterSpacing: '0.02em' }}>{b.generated.toUpperCase()}</div>
              <i data-lucide="arrow-right" style={{ width: 13, height: 13, strokeWidth: 1.5, color: 'var(--color-cloud-dark)' }}></i>
            </div>
          );
        })}
      </SCard>
    )}
  </Shell>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
