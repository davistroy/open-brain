<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Open Brain — Design Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="colors_and_type.css?v=a5" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; overflow: hidden; }
  .frame { width: 100%; height: 100%; border: 0; display: block; background: var(--color-bg-layout-main); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const Frame = ({ src }) => (
  <iframe className="frame" src={src} loading="lazy" scrolling="no"></iframe>
);

const DESKTOP_W = 1440, DESKTOP_H = 900;

const App = () => (
  <DesignCanvas>
    <DCSection id="capture" title="01 · Capture"
      subtitle="Everything flows in here — voice, email, manual. The system weighs and classifies before anything is shown.">
      <DCArtboard id="ingest" label="Ingest pipeline"      width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/04-ingest.html" /></DCArtboard>
      <DCArtboard id="capture-detail" label="Capture detail · voice note" width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/10-capture-detail.html" /></DCArtboard>
      <DCArtboard id="timeline" label="Timeline"            width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/03-timeline.html" /></DCArtboard>
    </DCSection>

    <DCSection id="knowledge" title="02 · Knowledge"
      subtitle="The reader lives here. Entities, search, and the briefs surface — the product's daily morning ritual.">
      <DCArtboard id="dashboard" label="Dashboard"           width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/01-dashboard.html" /></DCArtboard>
      <DCArtboard id="search-flat" label="Search · flat"     width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/02a-search-flat.html" /></DCArtboard>
      <DCArtboard id="search-grouped" label="Search · grouped" width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/02b-search-grouped.html" /></DCArtboard>
      <DCArtboard id="entities" label="Entities · index"     width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/05-entities.html" /></DCArtboard>
      <DCArtboard id="entity-detail" label="Entity detail · dossier" width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/06-entity-detail.html" /></DCArtboard>
    </DCSection>

    <DCSection id="briefs" title="03 · Briefs"
      subtitle="AI-drafted summaries. Daily morning brief, weekly retro, dossier, decision memo, project state-of.">
      <DCArtboard id="briefs-list" label="Briefs · library"  width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/07-briefs.html" /></DCArtboard>
      <DCArtboard id="brief-reader" label="Brief · reader"   width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/08-brief-detail.html" /></DCArtboard>
    </DCSection>

    <DCSection id="governance" title="04 · Governance"
      subtitle="The Board — open decisions, commitments, and follow-ups. Less GTD, more meeting-of-one.">
      <DCArtboard id="board" label="Board"                  width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/09-board.html" /></DCArtboard>
    </DCSection>

    <DCSection id="system" title="05 · System + edges"
      subtitle="Settings, empty states, first-run. The quiet parts of the product.">
      <DCArtboard id="settings" label="Settings · sources"   width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/11-settings.html" /></DCArtboard>
      <DCArtboard id="empty" label="Empty states"            width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/12-empty-states.html" /></DCArtboard>
      <DCArtboard id="onboarding" label="First-run · onboarding" width={DESKTOP_W} height={DESKTOP_H}><Frame src="screens/13-onboarding.html" /></DCArtboard>
    </DCSection>
  </DesignCanvas>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
