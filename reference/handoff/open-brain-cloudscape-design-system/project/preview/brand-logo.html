<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css?v=a4">
<style>
  body { margin: 0; padding: 0; background: var(--color-bg-container); font-family: var(--font-family-base); }
  .lockup { padding: 24px 28px 10px; display: flex; align-items: center; gap: 14px; }
  .mark svg {
    display: block;
    fill: none;
    stroke: var(--color-book-cloth);
    stroke-width: 0.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .wm {
    font-family: var(--font-family-display);
    font-size: 30px;
    font-weight: 300;
    letter-spacing: -0.015em;
    color: var(--color-slate-medium);
    line-height: 1;
  }
  .wm .bold { font-weight: 400; }

  .meta {
    padding: 6px 28px 22px;
    font-family: var(--font-family-monospace);
    font-size: 10.5px;
    color: var(--color-text-small);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; display: inline-block; }
</style></head>
<body>
  <div class="lockup">
    <div class="mark">
      <!-- Lucide brain (stroke-based, same glyph as before) -->
      <svg width="40" height="40" viewBox="0 0 24 24">
        <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
        <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
        <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
      </svg>
    </div>
    <span class="wm">Open <span class="bold">Brain</span></span>
  </div>

  <div class="meta">
    <span><span class="sw" style="background:var(--color-book-cloth)"></span>Book Cloth · #CC785C</span>
    <span><span class="sw" style="background:var(--color-slate-medium)"></span>Slate · #262624</span>
    <span>0.9px stroke</span>
    <span>Lucide brain · Space Grotesk</span>
  </div>
</body></html>
