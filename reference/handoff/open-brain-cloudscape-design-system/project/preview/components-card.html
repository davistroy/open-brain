<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css?v=a4">
<style>
  body { padding: 22px 24px; background: var(--color-bg-layout-main); font-family: var(--font-family-base); display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .card {
    background: var(--color-bg-container);
    border: 1px solid var(--color-cloud-light);
    border-radius: 2px;
    box-shadow: 0 1px 0 rgba(20, 20, 19, 0.03);
    overflow: hidden;
  }
  .hdr {
    padding: 11px 16px;
    border-bottom: 1px solid var(--color-cloud-light);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .hdr h3 {
    margin: 0;
    font-family: var(--font-family-display);
    font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--color-text-heading);
  }
  .hdr .actions {
    font-size: 12.5px; color: var(--color-book-cloth-dark); font-weight: 500;
    text-decoration: none;
  }
  .body { padding: 14px 16px; font-size: 13.5px; color: var(--color-text-body); }
  .stat {
    font-family: var(--font-family-display);
    font-size: 40px; font-weight: 400; letter-spacing: -0.035em; line-height: 1;
    color: var(--color-text-heading);
    font-variant-numeric: tabular-nums;
  }
  .sub { font-size: 12px; color: var(--color-text-small); margin-top: 6px; letter-spacing: 0.005em; }
  .row { display: flex; gap: 8px; align-items: baseline; margin-top: 4px; }
  .delta { font-family: var(--font-family-monospace); font-size: 11px; color: #5E8F4A; letter-spacing: 0.02em; }
</style></head>
<body>
  <div class="card">
    <div class="hdr"><h3>Total captures</h3><a class="actions">View all →</a></div>
    <div class="body">
      <div class="stat">1,247</div>
      <div class="sub">1,180 complete · 12 pending · 3 failed</div>
    </div>
  </div>

  <div class="card">
    <div class="hdr"><h3>Weekly activity</h3><a class="actions">Last 7 days</a></div>
    <div class="body">
      <div class="row">
        <div class="stat">84</div>
        <span class="delta">▲ 12%</span>
      </div>
      <div class="sub">captures this week · avg 12/day</div>
    </div>
  </div>
</body></html>
