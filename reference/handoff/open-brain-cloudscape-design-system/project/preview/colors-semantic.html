<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css?v=a4">
<style>
  body { padding: 16px; background: var(--color-bg-container); font-family: var(--font-family-base); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid; }
  .dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
  .meta { display: flex; flex-direction: column; line-height: 1.2; }
  .name { font-size: 12px; font-weight: 600; }
  .val { font-size: 10px; font-family: var(--font-family-monospace); color: var(--color-text-small); }
</style></head>
<body>
  <div class="grid">
    <div class="item" style="background: var(--color-bg-status-success); border-color: var(--color-border-status-success)">
      <div class="dot" style="background: var(--color-text-status-success)"></div>
      <div class="meta"><span class="name" style="color: var(--color-text-status-success)">Success</span><span class="val">Olive · #5F5B3B</span></div>
    </div>
    <div class="item" style="background: var(--color-bg-status-info); border-color: var(--color-border-status-info)">
      <div class="dot" style="background: var(--color-text-status-info)"></div>
      <div class="meta"><span class="name" style="color: var(--color-text-status-info)">Info</span><span class="val">Moss · #7A8471</span></div>
    </div>
    <div class="item" style="background: var(--color-bg-status-warning); border-color: var(--color-border-status-warning)">
      <div class="dot" style="background: var(--color-text-status-warning)"></div>
      <div class="meta"><span class="name" style="color: var(--color-text-status-warning)">Warning</span><span class="val">Kraft · #D4A27F</span></div>
    </div>
    <div class="item" style="background: var(--color-bg-status-error); border-color: var(--color-border-status-error)">
      <div class="dot" style="background: var(--color-text-status-error)"></div>
      <div class="meta"><span class="name" style="color: var(--color-text-status-error)">Error</span><span class="val">Faded Red · #BF4939</span></div>
    </div>
  </div>
</body></html>
