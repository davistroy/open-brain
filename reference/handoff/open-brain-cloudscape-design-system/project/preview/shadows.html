<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css?v=a4">
<style>
  body { padding: 28px 20px; background: var(--color-bg-layout-main); display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: var(--color-bg-container); padding: 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; }
  .c1 { box-shadow: var(--shadow-container); }
  .c2 { box-shadow: var(--shadow-dropdown); }
  .c3 { box-shadow: var(--shadow-panel); }
  .name { font-size: 12px; font-weight: 700; color: var(--color-text-heading); }
  .lbl { font-family: var(--font-family-monospace); font-size: 10px; color: var(--color-text-small); }
</style></head>
<body>
  <div class="card c1"><span class="name">container</span><span class="lbl">0 0 1px 1px #e9ebed, 0 1px 8px 2px rgba(0,7,22,.12)</span></div>
  <div class="card c2"><span class="name">dropdown / modal / popover</span><span class="lbl">0 4px 20px 1px rgba(0,7,22,.10)</span></div>
  <div class="card c3"><span class="name">panel</span><span class="lbl">0 0 0 1px #b6bec9</span></div>
</body></html>
