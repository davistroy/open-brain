<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css?v=a4">
<style>
  body { margin: 0; padding: 0; background: var(--color-slate-dark); color: var(--color-ivory-light); font-family: var(--font-family-base); }
  .topnav {
    height: 48px;
    background: var(--color-slate-dark);
    display: flex; align-items: center;
    padding: 0 20px; gap: 28px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-family-display);
    font-weight: 400; font-size: 14px; letter-spacing: -0.005em;
    color: var(--color-ivory-light);
  }
  .logo .mark {
    width: 18px; height: 18px;
    background: var(--color-book-cloth);
    display: inline-block;
  }

  .items { display: flex; gap: 22px; flex: 1; font-size: 13.5px; }
  .items a {
    font-family: var(--font-family-base);
    color: var(--color-cloud-medium);
    cursor: pointer;
    text-decoration: none;
    font-weight: 200;
    letter-spacing: 0.015em;
    position: relative;
    padding: 14px 0;
    transition: color 120ms linear, font-weight 0s;
  }
  .items a:hover { color: var(--color-ivory-light); }
  .items a.active {
    color: var(--color-ivory-light);
    font-weight: 400;
    letter-spacing: 0.005em;
  }
  .items a.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--color-book-cloth);
  }

  .right { display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--color-cloud-medium); }
  .right a { font-family: var(--font-family-base); color: inherit; text-decoration: none; font-weight: 200; letter-spacing: 0.01em; cursor: pointer; }
  .right a:hover { color: var(--color-ivory-light); }
  .search {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 4px 8px;
    font-size: 12px;
    color: var(--color-cloud-medium);
    min-width: 180px;
  }
  .search svg { flex-shrink: 0; }
  .search .kbd {
    margin-left: auto;
    font-family: var(--font-family-monospace);
    font-size: 10.5px;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 0 4px;
  }
  .avatar {
    width: 24px; height: 24px;
    background: var(--color-book-cloth);
    color: var(--color-ivory-light);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 400; font-size: 11px; letter-spacing: 0.02em;
  }
</style></head>
<body>
  <div class="topnav">
    <div class="logo"><span class="mark"></span>Open Brain</div>
    <nav class="items">
      <a class="active">Dashboard</a>
      <a>Search</a>
      <a>Timeline</a>
      <a>Ingest</a>
      <a>Entities</a>
      <a>Briefs</a>
      <a>Board</a>
    </nav>
    <div class="right">
      <div class="search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search…</span>
        <span class="kbd">⌘K</span>
      </div>
      <a>Help</a>
      <a>Settings</a>
      <span class="avatar">T</span>
    </div>
  </div>
</body></html>
