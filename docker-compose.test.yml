# Integration test infrastructure — ephemeral Postgres+pgvector and Redis
# Usage: docker compose -f docker-compose.test.yml up -d
# Teardown: docker compose -f docker-compose.test.yml down -v
#
# Ports are mapped to non-default values to avoid conflicts with running services.
# tmpfs for Postgres data = fast, ephemeral, no disk cleanup needed.

services:
  test-postgres:
    image: pgvector/pgvector:pg16
    container_name: open-brain-test-postgres
    environment:
      POSTGRES_DB: openbrain_test
      POSTGRES_USER: openbrain_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbrain_test -d openbrain_test -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-redis:
    image: redis:7-alpine
    container_name: open-brain-test-redis
    ports:
      - "6381:6379"
    command: redis-server --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Python batch-ingest sidecar (trigger_server.py) — exercises the full
  # production image so PR #91 (env var name), PR #92 (Dockerfile CMD), and
  # PR #93 (per-sidecar INGEST_SOURCE binding) regressions are caught by the
  # gated e2e test (packages/workers/src/__tests__/integration/ingest-e2e.test.ts,
  # guarded by INGEST_E2E=1). No depends_on — the e2e test exercises the HTTP
  # trigger boundary directly and stubs downstream pipeline dispatch.
  test-sidecar:
    build:
      context: .
      dockerfile: docker/ingest-sidecar/Dockerfile
    image: open-brain-ingest-sidecar:test
    container_name: open-brain-test-sidecar
    environment:
      INGEST_TRIGGER_SECRET: test-secret-do-not-use-in-prod
      INGEST_SOURCE: financial  # matches e2e test fixture source_type
      CAPTURE_API_URL: http://test-core-api:3000/api/v1/captures
      CAPTURE_API_CALLER: integration-test
      TZ: America/New_York
    ports:
      - "8099:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
