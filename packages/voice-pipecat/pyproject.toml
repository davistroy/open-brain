[project]
name = "open-brain-voice-pipecat"
version = "0.1.0"
description = "Open Brain conversational voice service — Pipecat + Deepgram + Claude"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[silero,deepgram]>=0.0.60",
    "anthropic>=0.49.0",
    "redis>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.0"]
piper = ["piper-tts>=1.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
